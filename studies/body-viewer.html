<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clean Body Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--ink:#efe9dc;--dim:#bdb5a6;--panel:rgba(27,25,33,.82);--line:rgba(239,233,220,.16);--brass:#d6a54e;--ground:#1d1c22;color-scheme:dark}
html,body{height:100%;margin:0}body{background:var(--ground);color:var(--ink);font:15px/1.4 system-ui,sans-serif;overflow:hidden;touch-action:none;padding:0 max(16px,env(safe-area-inset-left,0px))}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{position:fixed;z-index:5;top:12px;right:12px;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
h1{font:400 22px Georgia,serif;margin:0}.sub{color:var(--dim);font-size:13px;margin:4px 0 0}
.label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13.5px;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer}
button[aria-pressed="true"]{background:rgba(214,165,78,.22);border-color:var(--brass)}
.note{font-size:12.5px;color:var(--dim);margin-top:12px}
@media (max-width:640px){.panel{top:auto;bottom:10px;left:10px;right:10px;width:auto}}
</style>
<canvas id="stage" aria-label="Four painted figures built on one seamless body"></canvas>
<aside class="panel"><h1>Clean body study</h1><p class="sub">One seamless mesh · everything else is paint</p>
<div class="label">View</div><div class="chips" id="views"><button data-v="full" aria-pressed="true">Full</button><button data-v="face">Faces</button></div>
<div class="label">Build · everyone</div><input id="build" type="range" min="-1" max="1" step="0.05" value="0" aria-label="Shift every build from lean to heavy" style="width:100%">
<div class="label">Turn</div><div class="chips" id="turn"><button data-y="0" aria-pressed="true">Front</button><button data-y="0.7">Three-quarter</button><button data-y="1.5708">Side</button><button data-y="3.1416">Back</button></div>
<p class="note">Faces, hair, beards, ink and clothes are painted by code from where each point sits on the body: no image files, no seams. Coats, robes, helms and hair volumes come next as a few shared meshes.</p></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
/* ---------- Painted bodies: one seamless mesh, everything else is paint, computed from where each point sits on the body ---------- */
// rest-space coordinates (as modelled): x across, y forward is negative, z up, metres.
const PAINT_GLSL=`
uniform vec3 uSkin,uHair,uEye,uShirt,uVest,uPants,uBelt,uBoots,uTrim,uInk,uLip;
uniform vec4 uF1; // vest, bare chest, ink, freckles
uniform vec4 uF2; // hair (0 bald 1 short 2 long), gloves, stripes, tabard
varying vec3 vRest;
float hsh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hsh(i),hsh(i+vec2(1.,0.)),f.x),mix(hsh(i+vec2(0.,1.)),hsh(i+vec2(1.,1.)),f.x),f.y);}
float inside(float d){float w=max(fwidth(d),1e-5);return 1.-smoothstep(-w,w,d);}  // 1 where d<0, antialiased
float gss(vec2 p,vec2 c,vec2 w){vec2 d=(p-c)/w;return exp(-dot(d,d));}
float hairline(float th){ // height of the hairline around the head (0 = brow, pi = nape)
  th=abs(th);
  return th<0.6?mix(1.745,1.748,th/0.6):th<1.15?mix(1.748,1.706,(th-0.6)/0.55):th<1.5?mix(1.706,1.655,(th-1.15)/0.35):th<2.45?mix(1.655,1.618,(th-1.5)/0.95):mix(1.618,1.604,(th-2.45)/0.7);
}
vec3 cloth(vec3 base,vec3 p,float k){return base*(0.94+0.06*vnoise(p.xz*vec2(260.,90.))+0.05*(vnoise(p.xz*40.)-.5)*k);}
vec3 paintHead(vec3 p){
  float ax=abs(p.x), th=atan(p.x,-(p.y-0.002)), front=(1.-smoothstep(-0.07,-0.03,p.y));
  vec3 c=uSkin*(0.97+0.05*vnoise(p.xz*300.));
  // under the jaw and the neck sit in shadow
  c*=mix(0.84,1.,smoothstep(1.56,1.6,p.z));
  c=mix(c,c*vec3(1.06,0.9,0.88),0.5*front*(gss(vec2(ax,p.z),vec2(0.052,1.646),vec2(0.018,0.016))+0.6*gss(vec2(ax,p.z),vec2(0.,1.655),vec2(0.01,0.012))));
  if(uF1.w>0.5){float fr=step(0.9,hsh(floor(p.xz*520.)))*front*gss(vec2(ax,p.z),vec2(0.03,1.656),vec2(0.04,0.02));c=mix(c,c*vec3(0.78,0.6,0.5),fr);}
  // lips and mouth
  if(front>0.){float up=inside(length((vec2(ax,p.z)-vec2(0.,1.6205))/vec2(0.019,0.0042))-1.), lo=inside(length((vec2(ax,p.z)-vec2(0.,1.6135))/vec2(0.017,0.0048))-1.);
    c=mix(c,uLip*0.92,up*front*(uF1.y>0.5?0.:1.)); c=mix(c,uLip,lo*front);
    float line=inside(abs(p.z-(1.6175-0.06*ax*ax*40.))-0.0011)*step(ax,0.02)*front; c=mix(c,uLip*0.45,line);
    // nostrils
    c=mix(c,c*0.45,front*inside(length(vec2(ax-0.0078,p.z-1.6495))-0.0024));
    // eyes: almond whites, iris, pupil, lid line
    c*=1.-0.38*front*(gss(vec2(ax,p.z),vec2(0.034,1.692),vec2(0.02,0.011)));             // shadow under the brow
    c*=1.-0.18*front*gss(vec2(ax,p.z),vec2(0.017,1.64),vec2(0.006,0.03));                 // beside the nose
    c*=1.-0.22*front*gss(vec2(ax,p.z),vec2(0.,1.637),vec2(0.012,0.004));                  // under the nose
    c*=1.-0.15*front*gss(vec2(ax,p.z),vec2(0.05,1.626),vec2(0.012,0.02));                 // hollow of the cheek
    c*=1.+0.12*front*gss(vec2(ax,p.z),vec2(0.,1.69),vec2(0.006,0.03));                    // light down the bridge
    vec2 e=vec2(ax-0.0338,p.z-1.6872); float alm=length(e/vec2(0.0098,0.0038))-1.;
    float w=inside(alm)*front; c=mix(c,mix(uSkin*0.55,vec3(0.72,0.7,0.66),0.6),w);
    float ir=inside(length(e-vec2(-0.0004*sign(p.x),0.0004))-0.0037)*w; c=mix(c,uEye,ir);
    c=mix(c,vec3(0.04),inside(length(e)-0.0018)*w);
    c=mix(c,vec3(0.95),inside(length(e-vec2(0.0012,0.0012))-0.0006)*w);
    float lid=inside(abs(alm-0.15)-0.2)*step(-0.001,e.y)*front; c=mix(c,uSkin*0.32,lid);
    c=mix(c,c*0.82,inside(abs(alm-0.55)-0.25)*step(0.0015,e.y)*front); // lid crease
    // brows
    float bx=ax-0.036, bz=1.6995+0.003*(1.-(bx*bx/0.000361))+0.004*clamp(bx/0.02,-1.,1.);
    float brow=inside(abs(p.z-bz)-(0.0042-0.0022*smoothstep(0.,0.02,bx)))*step(0.012,ax)*step(ax,0.058)*front;
    c=mix(c,uHair*0.75,brow);
  }
  // ink: a line down the brow, bars across the cheekbones, two lines on the chin
  if(uF1.z>0.5){float ink=0.;
    ink=max(ink,inside(ax-0.0032)*step(1.708,p.z)*step(p.z,1.79));
    ink=max(ink,inside(abs(p.z-1.6535-(ax-0.03)*0.12)-0.0035)*step(0.031,ax)*step(ax,0.078));
    ink=max(ink,inside(abs(ax-0.0105)-0.0022)*step(1.574,p.z)*step(p.z,1.598));
    c=mix(c,uInk,ink*front*0.92+ink*(1.-front)*0.5);}
  // hair painted on the scalp
  if(uF2.x>0.5){float hl=hairline(th)-(uF2.x>1.5?0.04*smoothstep(1.4,2.6,abs(th)):0.); float h=smoothstep(-0.002,0.002,p.z-hl)*step(ax,0.083+step(1.68,p.z));
    float strands=0.78+0.3*vnoise(vec2(th*90.,p.z*160.))+0.12*vnoise(vec2(th*12.,p.z*20.));
    c=mix(c,uHair*strands,h);}
  else c=mix(c,c*0.93,smoothstep(1.74,1.75,p.z)*0.5);
  return c;
}
vec3 paintBody(vec3 p){
  float ax=abs(p.x); bool armR=(ax>0.168-0.25*max(0.,p.z-1.40)&&p.z>1.05)||(ax>0.25&&p.z>0.6);
  if(p.z>1.556&&!armR)return paintHead(p);
  vec3 c;
  if(armR){ // sleeves to the wrist, then hands (bare or gloved)
    float wrist=0.962+(ax-0.35)*0.4;
    if(p.z>wrist&&uF1.y>0.5){c=uSkin*(0.95+0.05*vnoise(p.xz*200.));c*=1.-0.12*gss(vec2(ax-0.24,p.z-1.32),vec2(0.),vec2(0.02,0.05));c*=1.+0.08*gss(vec2(ax-0.21,p.z-1.4),vec2(0.),vec2(0.03,0.03));}
    else if(p.z>wrist){c=cloth(uShirt,p,1.);if(uF2.z>2.5)c=cloth(uVest,p,1.); c*=mix(0.82,1.,smoothstep(wrist,wrist+0.03,p.z)); c=mix(c,c*0.7,inside(abs(p.z-wrist-0.022)-0.0012)*step(0.5,fract(p.x*220.)));}
    else if(uF2.y>0.5){c=cloth(uBelt,p,0.5);c=mix(c,c*0.7,inside(abs(p.z-wrist+0.006)-0.004));}
    else{c=uSkin*(0.95+0.05*vnoise(p.xz*200.));c*=mix(0.85,1.,smoothstep(0.78,0.86,p.z));}
    return c;}
  if(p.z>1.468){ // neck, with the collar
    c=uSkin*mix(0.86,0.97,smoothstep(1.47,1.53,p.z));
    float collar=(1.-step(0.5,uF1.y))*step(p.z,1.505)*(1.-step(p.y,-0.02)*inside(ax-(p.z-1.468)*0.9)); c=mix(c,cloth(uShirt,p,1.)*0.95,collar);
    return c;}
  if(p.z>1.04&&uF1.y>0.5){ // bare torso: muscle painted in, as Valheim does
    float fr=1.-smoothstep(-0.05,0.01,p.y);
    c=uSkin*(0.96+0.04*vnoise(p.xz*220.));
    float pec=1.29+0.035*(1.-pow(clamp((ax-0.075)/0.075,-1.,1.),2.));
    c*=1.-0.3*fr*exp(-pow((p.z-pec)/0.009,2.))*step(ax,0.16);                       // under the pecs
    c*=1.+0.08*fr*gss(vec2(ax,p.z),vec2(0.075,1.34),vec2(0.045,0.035));             // pecs catch the light
    c*=1.-0.18*fr*inside(ax-0.0035)*step(1.08,p.z)*step(p.z,1.3);                   // the line down the middle
    for(int i=0;i<3;i++){float zz=1.125+float(i)*0.05;c*=1.-0.14*fr*exp(-pow((p.z-zz)/0.005,2.))*step(ax,0.05);}  // abs
    c*=1.-0.2*fr*exp(-pow((p.z-(1.448-(ax-0.03)*0.18))/0.005,2.))*step(0.02,ax)*step(ax,0.13);  // collarbones
    c=mix(c,c*vec3(0.75,0.55,0.5),fr*inside(length(vec2(ax-0.085,p.z-1.315))-0.006));          // nipples
    c*=1.-0.35*fr*inside(length(vec2(ax,p.z-1.085))-0.004);                        // navel
    c*=1.-0.15*smoothstep(0.,0.06,p.y)*gss(vec2(ax,p.z),vec2(0.,1.3),vec2(0.012,0.12));  // spine
    c*=mix(0.84,1.,smoothstep(1.04,1.075,p.z));
    return c;}
  if(p.z>1.04){ // torso: shirt, perhaps a waistcoat over it
    c=cloth(uShirt,p,1.);
    if(uF2.z>0.5&&uF2.z<1.5){float s=step(0.5,fract(p.z*38.));c=mix(c,c*vec3(0.75,0.78,0.92),s*0.5);} // striped linen
    float vee=step(p.y,-0.02)*inside(ax-(p.z-1.39)*0.55)*step(1.39,p.z); c=mix(c,uSkin*0.9,vee);
    c=mix(c,c*0.65,step(p.y,-0.02)*inside(ax-0.0011)*step(p.z,1.39)*step(1.25,p.z)); // placket
    if(uF1.x>0.5){float open=step(p.y,-0.02)*inside(ax-0.018-(p.z-1.2)*0.12);
      float top=1.47-0.75*max(0.,ax-0.055); float arm=max(inside(length(vec2((ax-0.168)/0.072,(p.z-1.452)/0.13))-1.),1.-inside(p.z-top));
      float v=(1.-open)*(1.-arm);
      vec3 vc=cloth(uVest,p,1.); vc=mix(vc,vc*0.72,inside(abs(ax-0.018-(p.z-1.2)*0.12-0.006)-0.0009)*step(0.5,fract(p.z*120.))*step(p.y,-0.02));
      vc=mix(vc,uTrim,step(p.y,-0.02)*inside(length(vec2(ax-0.03-(p.z-1.2)*0.12,mod(p.z-1.06,0.045)-0.022))-0.0042));
      c=mix(c,vc,v);}
    if(uF2.w>0.5){float tb=inside(ax-0.115)*step(1.06,p.z)*step(p.z,1.43); vec3 t=cloth(uTrim,p,0.6); t=mix(t,t*0.7,inside(abs(ax-0.105)-0.003)); c=mix(c,t,tb);}
    c*=mix(0.82,1.,smoothstep(1.04,1.075,p.z));
    return c;}
  if(p.z>0.985){ // belt and buckle
    c=cloth(uBelt,p,0.3); c=mix(c,c*0.6,inside(abs(p.z-1.0125)-0.024)*inside(-(abs(p.z-1.0125)-0.021)));
    float bk=step(p.y,-0.02)*inside(max(ax-0.02,abs(p.z-1.0125)-0.02)); c=mix(c,uTrim,bk); c=mix(c,uTrim*0.5,bk*inside(max(ax-0.011,abs(p.z-1.0125)-0.011)));
    return c;}
  if(p.z>0.335){ // trousers
    c=cloth(uPants,p,1.5);
    float lx=ax-0.11; c*=0.92+0.08*(1.-smoothstep(0.,0.05,abs(lx))); // rounder down the middle of each leg
    c=mix(c,c*0.75,inside(abs(lx-0.055)-0.0011)*step(0.5,fract(p.z*110.)));                 // outer seam
    c*=1.-0.1*gss(vec2(lx,p.z),vec2(0.,0.52),vec2(0.05,0.03));                               // knee
    c*=mix(0.8,1.,smoothstep(0.335,0.37,p.z));
    return c;}
  // boots
  c=cloth(uBoots,p,0.4)*mix(1.08,0.9,1.-smoothstep(0.05,0.33,p.z));
  c=mix(c,c*1.25,inside(abs(p.z-0.315)-0.018)); c=mix(c,vec3(0.08,0.06,0.05),inside(p.z-0.028));
  c=mix(c,c*0.6,inside(abs(p.z-0.296)-0.0012));
  return c;
}`;
function preparePainted(gltf){
  gltf.scene.traverse(o=>{if(!o.isMesh||o.geometry.userData.rest)return;const ca=o.geometry.attributes.color;o.geometry.userData.rest=true;
    const sz=ca.itemSize,src=ca.array,div=!ca.normalized?1:src instanceof Uint8Array?255:src instanceof Uint16Array?65535:1,out=new Float32Array(ca.count*3);
    for(let i=0;i<ca.count;i++){out[i*3]=src[i*sz]/div-0.5;out[i*3+1]=src[i*sz+1]/div-0.5;out[i*3+2]=src[i*sz+2]/div*2;}
    o.geometry.setAttribute('rest',new THREE.BufferAttribute(out,3)); o.geometry.deleteAttribute('color');});
}
const PAINT_KEYS=['uSkin','uHair','uEye','uShirt','uVest','uPants','uBelt','uBoots','uTrim','uInk','uLip'];
function paintedMaterial(look){
  const U={}; PAINT_KEYS.forEach(k=>U[k]={value:new THREE.Color(look[k]||'#888888')}); U.uF1={value:new THREE.Vector4(...look.f1)}; U.uF2={value:new THREE.Vector4(...look.f2)};
  const m=new THREE.MeshLambertMaterial({skinning:true,morphTargets:true,morphNormals:true}); m.extensions={derivatives:true};
  m.onBeforeCompile=sh=>{Object.assign(sh.uniforms,U);
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nattribute vec3 rest;\nvarying vec3 vRest;').replace('#include <begin_vertex>','#include <begin_vertex>\nvRest=rest;');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\n'+PAINT_GLSL).replace('vec4 diffuseColor = vec4( diffuse, opacity );','vec4 diffuseColor = vec4( paintBody(vRest), opacity );');};
  m.customProgramCacheKey=()=>'painted-body'; m.userData.U=U; return m;
}
// hair and beards: their own meshes, shaded with strands that run with the locks
function hairMaterial(hex){
  const U={uHair:{value:new THREE.Color(hex)}};
  const m=new THREE.MeshLambertMaterial({skinning:true}); m.extensions={derivatives:true};
  m.onBeforeCompile=sh=>{Object.assign(sh.uniforms,U);
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nattribute vec3 rest;\nvarying vec3 vRest;').replace('#include <begin_vertex>','#include <begin_vertex>\nvRest=rest;');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>',`#include <common>
uniform vec3 uHair; varying vec3 vRest;
float hh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float hn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hh(i),hh(i+vec2(1.,0.)),f.x),mix(hh(i+vec2(0.,1.)),hh(i+vec2(1.,1.)),f.x),f.y);}`)
      .replace('vec4 diffuseColor = vec4( diffuse, opacity );',`float th=atan(vRest.x,-(vRest.y-0.002));
  // painted strands: broad clumps, fine streaks, and dark grooves between clumps
  float w=hn(vec2(th*9.,vRest.z*14.))*0.9;
  float clump=fract(th*5.+w*1.3+hn(vec2(th*3.,vRest.z*40.))*0.25);
  float groove=smoothstep(0.84,0.98,clump)+(1.-smoothstep(0.0,0.05,clump))*0.5;
  float s=0.55*hn(vec2(th*60.+w*3.,vRest.z*6.))+0.45*hn(vec2(th*170.,vRest.z*20.));
  float shade=mix(0.74,1.06,s)*(1.-0.28*groove);
  shade*=mix(0.78,1.,smoothstep(1.5,1.6,vRest.z));                 // beard tips and the underside go darker
  vec4 diffuseColor=vec4(uHair*shade,opacity);`);};
  m.customProgramCacheKey=()=>'painted-hair'; return m;
}
const HAIR_MESHES=['Hair_Short','Hair_Swept','Hair_Ponytail','Hair_Long','Hair_Topknot','Beard_Full','Beard_Short','Beard_Pointed','Beard_Braided','Beard_Forked','Moustache_Chevron','Moustache_Horseshoe','Moustache_Walrus','Moustache_Handlebar','Moustache_Pencil'];
function dressFigure(root,look){ // body gets the paint, chosen hair and beard get hair, the rest hide
  const want=new Set([look.hair&&'Hair_'+look.hair,look.beard&&'Beard_'+look.beard,look.moustache&&'Moustache_'+look.moustache].filter(Boolean));
  root.traverse(o=>{if(!o.isMesh)return;o.frustumCulled=false;o.castShadow=true;
    const n=HAIR_MESHES.find(h=>o.name.startsWith(h));
    if(!n){o.material=paintedMaterial(look);}else if(want.has(n)){o.material=hairMaterial(look.uHair);}else o.visible=false;});
}

// body type: Lean and Heavy blend shapes on the one body, and a posture that goes with them
function setBuild(root,lean,heavy){
  root.userData.build=[lean,heavy];
  root.traverse(o=>{if(o.isMesh&&o.morphTargetDictionary&&'Lean' in o.morphTargetDictionary){o.morphTargetInfluences[o.morphTargetDictionary.Lean]=lean;o.morphTargetInfluences[o.morphTargetDictionary.Heavy]=heavy;}});
}
function buildPosture(root){ // call after the animation mixer each frame; offsets are applied once, never accumulated
  const [lean,heavy]=root.userData.build||[0,0];
  const B=root.userData.bones||(root.userData.bones={list:[['spine','x',0.1,0],['neck','x',0.16,0],['head','x',-0.12,0],['upper_armL','z',0,0.2],['upper_armR','z',0,-0.2]]
    .map(([n,ax,kl,kh])=>({o:root.getObjectByName(n),ax,kl,kh,prev:0,q:null})).filter(e=>e.o)});
  for(const e of B.list){
    if(e.q&&e.o.quaternion.equals(e.q))e.o.rotation[e.ax]-=e.prev;   // the mixer left it alone: undo last frame's offset first
    const off=e.kl*lean+e.kh*heavy; e.o.rotation[e.ax]+=off; e.prev=off; e.q=e.o.quaternion.clone();
  }
}

const cv=document.getElementById('stage'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio));R.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color('#1d1c22');const cam=new THREE.PerspectiveCamera(30,1,0.05,100);
scene.add(new THREE.HemisphereLight(0xe6ecff,0x3a3028,0.72));const sun=new THREE.DirectionalLight(0xfff2dc,0.8);sun.position.set(2,5,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-5,right:5,top:4,bottom:-1});scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(20,40),new THREE.MeshLambertMaterial({color:'#2a2830'}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
let figs=[],yaw=0,view='full';const GAP=0.85;
function place(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;
  if(view==='full'){const span=LOOKS.length*GAP+0.4;const d=Math.max(span/2/Math.tan(15*Math.PI/180)/cam.aspect,4);cam.fov=30;cam.position.set(0,1.1,d);cam.lookAt(0,0.92,0);}
  else{cam.fov=14;const d=Math.max(0.75/Math.tan(7*Math.PI/180)/cam.aspect,0.42/Math.tan(7*Math.PI/180));cam.position.set(0,1.52,d+0.3);cam.lookAt(0,1.5,0);}
  figs.forEach((f,i)=>{if(view==='full'){f.m.position.set((i-(LOOKS.length-1)/2)*GAP,0,0);}else{const c=i%3,r=Math.floor(i/3);f.m.position.set((c-1)*0.42,r?-0.39:0,r?0.3:0);}});
  cam.updateProjectionMatrix();}
addEventListener('resize',place);
document.getElementById('views').onclick=e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;document.querySelectorAll('#views button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));place();};
document.getElementById('turn').onclick=e=>{const b=e.target.closest('button');if(!b)return;yaw=+b.dataset.y;document.querySelectorAll('#turn button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};
let drag=null;cv.addEventListener('pointerdown',e=>{drag=e.clientX;cv.setPointerCapture(e.pointerId);});cv.addEventListener('pointermove',e=>{if(drag!==null){yaw+=(e.clientX-drag)*0.01;drag=e.clientX;}});cv.addEventListener('pointerup',()=>drag=null);
const clock=new THREE.Clock();
document.getElementById('build').addEventListener('input',e=>{const v=+e.target.value;figs.forEach((f,i)=>{const b=LOOKS[i].build;let l=b[0],hv=b[1];if(v<0){l=Math.min(1,l-v);hv=Math.max(0,hv+v);}else{hv=Math.min(1,hv+v);l=Math.max(0,l-v);}setBuild(f.m,l,hv);});});
new THREE.GLTFLoader().load('body.gltf.json',g=>{preparePainted(g);
  LOOKS.forEach((L,i)=>{const m=THREE.SkeletonUtils.clone(g.scene);dressFigure(m,L);setBuild(m,L.build[0],L.build[1]);
    m.position.x=(i-(LOOKS.length-1)/2)*GAP;scene.add(m);const mix=new THREE.AnimationMixer(m),c=g.animations.find(a=>a.name==='Idle');if(c){const a=mix.clipAction(c);a.play();a.time=i*0.4;}figs.push({m,mix});});
  place();(function loop(){requestAnimationFrame(loop);const dt=Math.min(0.05,clock.getDelta());for(const f of figs){f.m.rotation.y=yaw;f.mix.update(dt);buildPosture(f.m);}R.render(scene,cam);})();});
