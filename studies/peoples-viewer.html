  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font-ui);overflow:hidden;touch-action:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);
  width:270px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
h1{font-family:var(--font-display);font-weight:400;font-size:24px;letter-spacing:.04em;margin:0;line-height:1.05}
.sub{font-size:13px;color:var(--ink-dim);margin:4px 0 0}
.stats{display:flex;gap:12px;margin-top:8px;font-size:12.5px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13.5px;font-weight:500;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button[aria-pressed="true"]{background:rgba(214,165,78,.22);border-color:var(--brass);color:#fff4dc}
.note{font-size:12.5px;color:var(--ink-dim);margin-top:14px;line-height:1.4}
.tag{position:fixed;z-index:4;left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  font-size:13px;color:var(--ink-dim);text-shadow:0 1px 2px #000}
#status{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:22px;color:var(--ink-dim);z-index:3;pointer-events:none;text-align:center;padding:24px}
@media (max-width:640px){
  .panel{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:max(10px, env(safe-area-inset-left,0px));right:max(10px, env(safe-area-inset-right,0px));
    width:auto;max-height:42%}
  .tag{display:none}
}
</style>
<style>
.names{position:fixed;inset:0;pointer-events:none;z-index:2}

const WATCH={tabard:['#3f3a6c'],metal:['#9aa2a8'],coat:['#3a4250'],leather:['#4a3020'],pants:['#2e3440'],boots:['#2a2420'],cloak:['#3f3a6c']};
const ROLE_KEYS=['skin','hair','shirt','vest','pants','leather','scarf','coat',null,null,'ink','wrap','fur','cloak','tabard','metal','lining','boots',null,null];
// pick a look: palette per role, which pieces show, and a build
function rollPerson(race,guard,rnd){
  rnd=rnd||Math.random; const R=PEOPLES[race]||PEOPLES.Wayfolk, any=a=>a[Math.floor(rnd()*a.length)];
  const jit=(hex,k)=>{const c=new THREE.Color(hex),j=1+(rnd()-0.5)*k;return [c.r*j,c.g*j,c.b*j];};
  const pal=[], on=new Array(20).fill(0); on[0]=1;
  ROLE_KEYS.forEach((k,i)=>{const src=(guard&&WATCH[k])||R[k]||PEOPLES.Wayfolk[k]||['#888888'];pal[i]=jit(any(src),k==='skin'||k==='hair'?0.08:0.16);});
  pal[8]=[0.11,0.09,0.08]; pal[9]=[0.92,0.9,0.86]; if(!R.metal&&!guard)pal[15]=jit('#c9973f',0.1);
  if(!R.lining)pal[16]=pal[7].map(v=>v*0.7); if(!R.ink)pal[10]=pal[0];
  for(const k in R.p)on[+k]=rnd()<R.p[k]?1:0;
  if(guard){on[16]=1;on[15]=1;on[18]=1;on[6]=1;on[4]=0;on[12]=0;on[14]=0;on[10]=0;on[9]=0;on[11]=0;on[17]=0;on[5]=0;}
  if(on[10]||on[16]||on[9]){on[1]=0;on[8]=0;} if(on[15]||on[12])on[4]=0; if(on[4])on[12]=0; if(on[17])on[6]=0; if(on[11]&&on[14])on[14]=0;
  if(on[8])on[1]=1;
  pal[18]=on[18]?pal[5]:pal[0]; pal[19]=on[4]?pal[7]:pal[2];
  const h=R.h[0]+rnd()*(R.h[1]-R.h[0]), w=R.w[0]+rnd()*(R.w[1]-R.w[0]);
  return {race,pal,on,h,w};
}
function peopleMaterials(look){
  const uPal={value:look.pal.map(c=>new THREE.Vector3(c[0],c[1],c[2]))}, uOn={value:look.on.slice()};
  const hide='\nint pc=int(color.g*32.0+0.5);\nif(uOn[pc]<0.5)gl_Position=vec4(0.0,0.0,-10.0,1.0);';
  const m=new THREE.MeshLambertMaterial({vertexColors:true,skinning:true});
  m.onBeforeCompile=sh=>{sh.uniforms.uPal=uPal;sh.uniforms.uOn=uOn;
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nuniform vec3 uPal[20];\nuniform float uOn[20];')
      .replace('#include <color_vertex>','#include <color_vertex>\nvColor=uPal[int(color.r*32.0+0.5)]*color.b;')
      .replace('#include <project_vertex>','#include <project_vertex>'+hide);};
  m.customProgramCacheKey=()=>'folk-look'; m.userData.uPal=uPal; m.userData.uOn=uOn;
  const d=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,skinning:true});
  d.onBeforeCompile=sh=>{sh.uniforms.uOn=uOn;sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nattribute vec3 color;\nuniform float uOn[20];').replace('#include <project_vertex>','#include <project_vertex>'+hide);};
  d.customProgramCacheKey=()=>'folk-depth';
  return [m,d];
}
// meta colours arrive as normalised integers; turn them into plain floats once
function preparePeoples(gltf){
  gltf.scene.traverse(o=>{if(!o.isMesh)return;const ca=o.geometry.attributes.color;if(!ca||o.geometry.userData.meta)return;o.geometry.userData.meta=true;
    const sz=ca.itemSize,src=ca.array,div=!ca.normalized?1:src instanceof Uint8Array?255:src instanceof Uint16Array?65535:1,out=new Float32Array(ca.count*3);
    for(let i=0;i<ca.count;i++){out[i*3]=src[i*sz]/div;out[i*3+1]=src[i*sz+1]/div;out[i*3+2]=src[i*sz+2]/div;}
    o.geometry.setAttribute('color',new THREE.BufferAttribute(out,3));});
}
function makeLooked(gltf,look){
  const m=THREE.SkeletonUtils.clone(gltf.scene);
  m.traverse(o=>{if(o.isMesh){const [mat,dep]=peopleMaterials(look);o.material=mat;o.customDepthMaterial=dep;o.castShadow=true;o.frustumCulled=false;}});
  m.scale.set(look.w,look.h,look.w); m.userData.look=look; return m;
}

  city:{Wayfolk:0.35,Aurelan:0.25,Hrimfolk:0.08,Ferrin:0.08,Zarhim:0.08,Ruadhan:0.08,Ilvari:0.04,Penitent:0.04},

  village:{Wayfolk:0.5,Aurelan:0.3,Ruadhan:0.1,Hrimfolk:0.1},port:{Wayfolk:0.4,Hrimfolk:0.3,Aurelan:0.2,Ferrin:0.1},

function raceAt(x,z){
  let mix=RACE_MIX.city; const dc=Math.hypot(x-CITY.x,z-CITY.z);
  if(Math.hypot(x-VILLAGE.x,z-VILLAGE.z)<200)mix=RACE_MIX.village; else if(Math.hypot(x-PORT.x,z-PORT.z)<200)mix=RACE_MIX.port;
  else if(dc<CITY.r)mix=RACE_MIX[quarterOf(Math.atan2(z-CITY.z,x-CITY.x)).name]||RACE_MIX.city; else if(dc<CITY.r+260)mix=RACE_MIX.outskirts;
  let u=Math.random(); for(const k in mix){u-=mix[k];if(u<=0)return k;} return 'Wayfolk';
}

const DESC={Hrimfolk:'The cold north. The sturdiest of all races: broad and tall, fair and fur-clad, braided and bearded.',Aurelan:'The eastern islands. Ingenious and feudal: house colours, waistcoats, tabards of their lords.',
 Ilvari:'Travellers with no fixed home, marked in blue ink for the magic they lost. Slender, in long blue coats.',Ferrin:'The Slag Isles. Short and broad from centuries of mining; bearded, aproned, sooty.',

const cv=document.getElementById('stage'), R=new THREE.WebGLRenderer({canvas:cv,antialias:true}); R.setPixelRatio(Math.min(2,devicePixelRatio)); R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=new THREE.Color('#1d1c22'); scene.fog=new THREE.Fog('#1d1c22',14,30);

scene.add(new THREE.HemisphereLight(0xdfe6ff,0x3a3028,0.75)); const sun=new THREE.DirectionalLight(0xfff2dc,0.85); sun.position.set(3,6,5); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-8,right:8,top:6,bottom:-2}); scene.add(sun);

const ORDER=['Hrimfolk','Aurelan','Ilvari','Ferrin','Zarhim','Ruadhan','Wayfolk','Penitent','Watch'];
let gltf=null, figs=[], mode='all', yaw=0, spin=false, seed=1;
const rng=s=>()=>(s=(s*16807)%2147483647)/2147483647;
function build(){
  for(const f of figs)scene.remove(f.m); figs=[]; const names=document.getElementById('names'); names.innerHTML='';
  const list=mode==='all'?ORDER.map(r=>[r,r]):Array.from({length:6},(_,i)=>[mode,(PEOPLES[mode]?PEOPLES[mode].name:'Watch')+' '+(i+1)]);
  const gap=mode==='all'?0.95:0.9;
  list.forEach(([race,label],i)=>{const look=rollPerson(race==='Watch'?(['Aurelan','Hrimfolk','Wayfolk','Ruadhan'][i%4]):race,race==='Watch',rng(seed*7919+i*104729+ORDER.indexOf(race)));
    const m=makeLooked(gltf,look); m.position.x=(i-(list.length-1)/2)*gap; scene.add(m);
    const mix=new THREE.AnimationMixer(m),clip=gltf.animations.find(c=>c.name==='Idle'); if(clip){const a=mix.clipAction(clip);a.play();a.time=i*0.37;}
    const sp=document.createElement('span'); sp.textContent=mode==='all'?(race==='Watch'?'City watch':PEOPLES[race].name):label; names.appendChild(sp); figs.push({m,mix,sp});});
  document.getElementById('desc').textContent=mode==='all'?'All eight peoples and the city watch. Pick one to see six of them.':DESC[mode];
  document.getElementById('tag').textContent=mode==='all'?'The eight peoples · first pass':(mode==='Watch'?'The city watch':PEOPLES[mode].name);
  resize();
}
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;const span=figs.length*0.95+0.6, need=Math.max(span/2/Math.tan(15*Math.PI/180)/cam.aspect,4.2);
  cam.position.set(0,1.25,need);cam.lookAt(0,0.95,0);cam.updateProjectionMatrix();}
addEventListener('resize',resize);
const rc=document.getElementById('races');
[['all','All']].concat(ORDER.map(r=>[r,r==='Watch'?'Watch':PEOPLES[r].name])).forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.k=k;b.setAttribute('aria-pressed',String(k==='all'));
  b.onclick=()=>{mode=k;rc.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));build();};rc.appendChild(b);});
document.getElementById('views').onclick=e=>{const b=e.target.closest('button');if(!b)return;yaw=+b.dataset.v;document.querySelectorAll('#views button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};
document.getElementById('reroll').onclick=()=>{seed++;build();};
document.getElementById('spin').onclick=e=>{spin=!spin;e.currentTarget.setAttribute('aria-pressed',String(spin));};
let drag=null; cv.addEventListener('pointerdown',e=>{drag=e.clientX;cv.setPointerCapture(e.pointerId);}); cv.addEventListener('pointermove',e=>{if(drag!==null){yaw+=(e.clientX-drag)*0.01;drag=e.clientX;}}); cv.addEventListener('pointerup',()=>drag=null);
const clock=new THREE.Clock(), v=new THREE.Vector3();
function loop(){requestAnimationFrame(loop);const dt=Math.min(0.05,clock.getDelta());if(spin)yaw+=dt*0.6;
  for(const f of figs){f.m.rotation.y=yaw;f.mix.update(dt);v.set(f.m.position.x,0,0).project(cam);f.sp.style.left=((v.x+1)/2*innerWidth)+'px';f.sp.style.top=((1-v.y)/2*innerHeight+8)+'px';}
  R.render(scene,cam);}
new THREE.GLTFLoader().load('peoples.gltf.json',g=>{gltf=g;preparePeoples(g);document.getElementById('status').remove();build();loop();},undefined,e=>{document.getElementById('status').textContent='Could not load the model.';});
</script>
