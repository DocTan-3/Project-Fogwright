<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tinker Model Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: full-bleed turntable stage; review controls in a side panel that drops to the bottom on phones */
:root{
  --ink:#efe9dc; --ink-dim:#bdb5a6; --panel:rgba(27,25,33,.8); --line:rgba(239,233,220,.16);
  --brass:#d6a54e; --teal:#5fe6d4; --ground:#1d1c22;
  --font-display:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --font-ui:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font-ui);overflow:hidden;touch-action:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);
  width:270px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
h1{font-family:var(--font-display);font-weight:400;font-size:24px;letter-spacing:.04em;margin:0;line-height:1.05}
.sub{font-size:13px;color:var(--ink-dim);margin:4px 0 0}
.stats{display:flex;gap:12px;margin-top:8px;font-size:12.5px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13.5px;font-weight:500;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button[aria-pressed="true"]{background:rgba(214,165,78,.22);border-color:var(--brass);color:#fff4dc}
.note{font-size:12.5px;color:var(--ink-dim);margin-top:14px;line-height:1.4}
.tag{position:fixed;z-index:4;left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  font-size:13px;color:var(--ink-dim);text-shadow:0 1px 2px #000}
#status{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:22px;color:var(--ink-dim);z-index:3;pointer-events:none;text-align:center;padding:24px}
@media (max-width:640px){
  .panel{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:max(10px, env(safe-area-inset-left,0px));right:max(10px, env(safe-area-inset-right,0px));
    width:auto;max-height:42%}
  .tag{display:none}
}
</style>

<canvas id="stage" aria-label="3D model of the light Tinker"></canvas>
<div id="status">Unpacking the Tinker…</div>

<aside class="panel" aria-label="Review controls">
  <h1>Light Tinker</h1>
  <p class="sub">Armor tier 1 · pass 7: hands</p>
  <div class="stats"><span><b id="triCount">–</b> triangles</span><span><b>890</b> KB</span><span><b>3</b> animations</span></div>

  <div class="label">View</div>
  <div class="chips" id="views">
    <button data-view="front">Front</button>
    <button data-view="side">Side</button>
    <button data-view="back">Back</button>
    <button data-view="three">¾</button>
    <button data-view="face">Face</button>
    <button data-view="legs">Legs</button>
    <button data-view="ear">Profile</button>
    <button data-view="arm">Arm</button>
    <button data-view="hand">Hand</button>
    <button id="spin" aria-pressed="true">Turntable</button>
    <button id="bare" aria-pressed="false">Base body</button>
  </div>

  <div class="label">Animation</div>
  <div class="chips" id="anims">
    <button data-anim="Idle" aria-pressed="true">Idle</button>
    <button data-anim="Walk" aria-pressed="false">Walk</button>
    <button data-anim="Aim" aria-pressed="false">Aim</button>
  </div>

  <div class="label">Gear</div>
  <div class="chips" id="gear">
    <button data-gear="clothes" aria-pressed="true">Shirt, trousers, boots</button>
    <button data-gear="coat" aria-pressed="true">Long coat</button>
    <button data-gear="goggles" aria-pressed="true">Goggles</button>
    <button data-gear="loupe" aria-pressed="true">Eyepiece</button>
    <button data-gear="scarf" aria-pressed="true">Scarf</button>
    <button data-gear="pauldron" aria-pressed="true">Gauge pauldron</button>
    <button data-gear="brace" aria-pressed="true">Leg brace</button>
    <button data-gear="belt" aria-pressed="true">Belt and tools</button>
    <button data-gear="rifle" aria-pressed="true">Spring rifle</button>
  </div>
  <p class="note">Built in Blender from code, rigged on the shared skeleton. Drag to orbit, scroll or pinch to zoom.</p>
</aside>
<div class="tag">Fogwright · character review</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(() => {
'use strict';
const canvas=document.getElementById('stage'), status=document.getElementById('status');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#2a2a33'); scene.fog=new THREE.Fog('#2a2a33',6,14);
const camera=new THREE.PerspectiveCamera(32,1,0.05,50);

scene.add(new THREE.HemisphereLight(0xdfe6f0,0x3a3028,0.55));
const key=new THREE.DirectionalLight(0xfff1dc,1.6); key.position.set(2.2,3.4,2.6); key.castShadow=true;
key.shadow.mapSize.set(2048,2048); Object.assign(key.shadow.camera,{left:-1.5,right:1.5,top:2.5,bottom:-0.5,near:0.5,far:10}); key.shadow.bias=-0.0004;
scene.add(key);
const rim=new THREE.DirectionalLight(0x9fb8ff,0.8); rim.position.set(-2.5,2.2,-2.8); scene.add(rim);
const fill=new THREE.DirectionalLight(0xffc89a,0.25); fill.position.set(-2,1,2); scene.add(fill);
const floor=new THREE.Mesh(new THREE.CircleGeometry(3,64).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:0x3a3934,roughness:0.95}));
floor.receiveShadow=true; scene.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(0.62,0.64,64).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xd6a54e,transparent:true,opacity:0.35}));
ring.position.y=0.002; scene.add(ring);

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();

// orbit
const orbit={yaw:0.5,pitch:0.12,dist:3.4,ty:0.95,tx:0,spin:true};
const VIEWS={front:[0,0.08,3.2,0.95],side:[Math.PI/2,0.08,3.2,0.95],back:[Math.PI,0.08,3.2,0.95],three:[0.7,0.2,3.2,0.95],face:[0.35,0.05,1.1,1.66],legs:[0.55,0.05,1.9,0.62],ear:[1.25,0.05,0.85,1.66],arm:[1.05,0.1,1.35,1.2],hand:[0.75,0.15,0.55,0.9,0.37]};
let tween=null;
function goView(v){const t=VIEWS[v];tween={from:{...orbit},to:{yaw:t[0],pitch:t[1],dist:t[2],ty:t[3],tx:t[4]||0},t:0};setSpin(false);}
const ptrs=new Map(); let pinch0=0,dist0=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});setSpin(false);tween=null;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);dist0=orbit.dist;}});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  if(ptrs.size===1){orbit.yaw-=(e.clientX-p.x)*0.008;orbit.pitch=Math.max(-0.3,Math.min(1.2,orbit.pitch+(e.clientY-p.y)*0.005));}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0)setDist(dist0*pinch0/d);}});
const endP=e=>{ptrs.delete(e.pointerId);pinch0=0;};
canvas.addEventListener('pointerup',endP);canvas.addEventListener('pointercancel',endP);
canvas.addEventListener('wheel',e=>{e.preventDefault();setDist(orbit.dist*Math.exp(e.deltaY*0.0012));tween=null;},{passive:false});
function setDist(d){orbit.tx*=0.5;orbit.dist=Math.max(0.7,Math.min(7,d));orbit.ty=0.95+(1.66-0.95)*Math.max(0,Math.min(1,(2.2-orbit.dist)/1.1));}
const spinBtn=document.getElementById('spin');
function setSpin(on){orbit.spin=on;spinBtn.setAttribute('aria-pressed',String(on));}
spinBtn.addEventListener('click',()=>setSpin(!orbit.spin));
document.getElementById('views').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)goView(b.dataset.view);});

// model
const GROUPS={
  clothes:/^(Trousers|Shirt|Vest|Boots|Gloves|BootCuff|Button)/, coat:/^(Coat|Sleeve|Cuff)/, goggles:/^Goggle/, loupe:/^Loupe/, scarf:/^Scarf/,
  pauldron:/^(Pauldron|Rivet|Gauge)/, brace:/^(Brace|KneeGear|KneeCore|Tooth)/, belt:/^(Belt|Buckle|Pouch|Wrench|Satchel|ToolRoll)/, rifle:/^Rifle/
};
let mixer=null, actions={}, current=null; const gearNodes={}; Object.keys(GROUPS).forEach(k=>gearNodes[k]=[]);
const loader=new THREE.GLTFLoader();
loader.load('tinker.gltf.json',gltf=>{
  const root=gltf.scene; let tris=0;
  root.traverse(o=>{
    if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;
      const g=o.geometry; tris+=(g.index?g.index.count:g.attributes.position.count)/3;
      if(o.material&&o.material.emissive&&o.material.emissiveIntensity!==undefined&&o.material.emissive.getHex()!==0)o.material.emissiveIntensity=1.6;}
    for(const k in GROUPS){if(GROUPS[k].test(o.name))gearNodes[k].push(o);}
  });
  document.getElementById('triCount').textContent=Math.round(tris).toLocaleString('en-US');
  scene.add(root);
  mixer=new THREE.AnimationMixer(root);
  gltf.animations.forEach(c=>{actions[c.name]=mixer.clipAction(c);});
  play('Idle'); status.remove();
},undefined,err=>{status.textContent='The model file could not be loaded. Reload the page to try again.';console.error(err);});

function play(name){
  const next=actions[name]; if(!next)return;
  next.reset().setEffectiveWeight(1).play();
  if(current&&current!==next)current.crossFadeTo(next,0.25,false);
  current=next;
  document.querySelectorAll('#anims button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.anim===name)));
}
document.getElementById('anims').addEventListener('click',e=>{const b=e.target.closest('[data-anim]');if(b)play(b.dataset.anim);});
document.getElementById('gear').addEventListener('click',e=>{const b=e.target.closest('[data-gear]');if(!b)return;
  const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));gearNodes[b.dataset.gear].forEach(o=>o.visible=on);});

document.getElementById('bare').addEventListener('click',e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(on));
  document.querySelectorAll('#gear button').forEach(b=>{b.setAttribute('aria-pressed',String(!on));gearNodes[b.dataset.gear].forEach(o=>o.visible=!on);});});
const clock=new THREE.Clock();
function frame(){
  const dt=Math.min(0.05,clock.getDelta());
  if(mixer)mixer.update(dt);
  if(orbit.spin)orbit.yaw+=dt*0.35;
  if(tween){tween.t=Math.min(1,tween.t+dt*2.2);const k=tween.t*tween.t*(3-2*tween.t);
    let dy=tween.to.yaw-tween.from.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy));
    orbit.yaw=tween.from.yaw+dy*k; orbit.pitch=tween.from.pitch+(tween.to.pitch-tween.from.pitch)*k;
    orbit.dist=tween.from.dist+(tween.to.dist-tween.from.dist)*k; orbit.ty=tween.from.ty+(tween.to.ty-tween.from.ty)*k; orbit.tx=tween.from.tx+(tween.to.tx-tween.from.tx)*k;
    if(tween.t>=1)tween=null;}
  const cp=Math.cos(orbit.pitch);
  camera.position.set(orbit.tx+Math.sin(orbit.yaw)*cp*orbit.dist,orbit.ty+Math.sin(orbit.pitch)*orbit.dist,Math.cos(orbit.yaw)*cp*orbit.dist);
  camera.lookAt(orbit.tx,orbit.ty,0);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();
})();
</script>
