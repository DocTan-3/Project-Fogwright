<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Character Creator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--ink:#efe9dc;--dim:#bdb5a6;--panel:rgba(27,25,33,.86);--line:rgba(239,233,220,.16);--brass:#d6a54e;--ground:#1d1c22;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{position:fixed;z-index:5;top:12px;right:max(12px,env(safe-area-inset-right,0px));width:300px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
h1{font:400 22px Georgia,serif;margin:0}.sub{color:var(--dim);font-size:13px;margin:4px 0 0}
.label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px;display:flex;justify-content:space-between}
.label span{letter-spacing:0;text-transform:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13.5px;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:6px 11px;min-height:34px;cursor:pointer}
button[aria-pressed="true"]{background:rgba(214,165,78,.22);border-color:var(--brass)}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.sw{width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.18)}
.sw[aria-pressed="true"]{border-color:var(--brass);box-shadow:0 0 0 2px rgba(214,165,78,.4)}
input[type=range]{width:100%;accent-color:var(--brass)}
.desc{font-size:13px;color:var(--dim);margin-top:6px}
.note{font-size:12.5px;color:var(--dim);margin-top:14px}
.tag{position:fixed;z-index:4;left:max(16px,env(safe-area-inset-left,0px));bottom:14px;font:400 26px Georgia,serif;text-shadow:0 1px 3px #000}
.tag small{display:block;font:13px system-ui,sans-serif;color:var(--dim)}
#status{position:fixed;inset:0;display:grid;place-items:center;color:var(--dim);font:20px Georgia,serif;pointer-events:none}
.hidden{display:none}
.sec{font:400 18px Georgia,serif;margin:20px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.lock{font-size:12px;color:var(--dim);margin:2px 0 0}
.label.sub2{letter-spacing:.06em;text-transform:none;font-size:12px;margin-top:8px}
button:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:700px){.panel{top:auto;bottom:10px;left:10px;right:10px;width:auto;max-height:46%}.tag{top:12px;bottom:auto}}
</style>
<canvas id="stage" aria-label="Your character, turning slowly"></canvas>
<div id="status">Shaping the clay…</div>
<div class="tag" id="tag"></div>
<aside class="panel" aria-label="Character options">
  <h1>Character creator</h1>
  <p class="sub">One body per sex · each people a shape</p>
  <div class="label">Body</div><div class="chips" id="sex"></div>
  <div class="label">People</div><div class="chips" id="people"></div>
  <p class="desc" id="pdesc"></p>
  <div class="label">Height <span id="hv"></span></div><input id="height" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Height, within this people's range">
  <div class="label">Build <span id="bv"></span></div><input id="build" type="range" min="0" max="1" step="0.01" value="0.55" aria-label="Build, from slight to heavy, within this people's range">
  <div class="label">Skin</div><div class="chips" id="skin"></div>
  <div class="label">Eyes</div><div class="chips" id="eyes"></div>
  <div class="label">Hair</div><div class="chips" id="hair"></div>
  <div class="label">Hair colour</div><div class="chips" id="hcol"></div>
  <div id="beardBox"><div class="label">Moustache</div><div class="chips" id="stache"></div></div>
  <div class="label">Base layer</div><div class="chips" id="lower"></div>
  <h2 class="sec">Equipment</h2>
  <div id="gear"></div>
  <div class="label">Dye</div><div class="chips" id="dye"></div>
  <div class="label">View</div><div class="chips" id="view"></div>
  <div class="chips" style="margin-top:10px"><button id="rand">Randomise</button></div>
  <p class="note" id="note"></p>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="bodypaint.js"></script>
<script src="equip.js"></script>
<script src="peoples.js"></script>
<script>
const st={sex:'m',people:'Aurelan',h:0.5,w:0.55,skin:1,eye:0,hair:'Swept',hcol:0,beard:null,stache:null,lower:0,view:'full',
  gear:{shirt:'linen_shirt',chest:'jerkin',legs:'trousers',feet:'boots',wrists:null,hands:null,waist:'belt',shoulders:null,head:null,back:null},belt:{hipR:'pouch'},dye:0};
// ---- scene
const cv=document.getElementById('stage'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio));R.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color('#1d1c22');const cam=new THREE.PerspectiveCamera(28,1,0.05,100);
scene.add(new THREE.HemisphereLight(0xe6ecff,0x3a3028,0.72));const sun=new THREE.DirectionalLight(0xfff2dc,0.8);sun.position.set(2,5,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-2,right:2,top:3,bottom:-1});scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(6,48),new THREE.MeshLambertMaterial({color:'#2a2830'}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
let G={}, fig=null, mixer=null, yaw=0.35, spin=true, clip='Idle';
const clock=new THREE.Clock();
function lerp(r,t){return r[0]+(r[1]-r[0])*t;}
function definition(){const P=PEOPLE[st.people],r=st.sex==='f'?P.f:P.m,w=lerp(r.w,st.w);return Math.max(0,Math.min(1,1+w))*(st.sex==='f'?0.4:1);}
function outfit(){return Object.assign({dye:EQ_DYES[st.dye][1],belt:st.belt},st.gear);}
function dress(){dressFigure(fig,look());dressOutfit(fig,look(),outfit(),R);}
function look(){return paintLook({people:st.people,sex:st.sex,skin:st.skin,hcol:st.hcol,eye:st.eye,hair:st.hair,beard:st.beard,moustache:st.stache,lower:st.lower,definition:definition()});}
function body(){
  const g=G[st.sex]; const P=PEOPLE[st.people], r=st.sex==='f'?P.f:P.m;
  if(fig){scene.remove(fig);}
  fig=THREE.SkeletonUtils.clone(g.scene); rigPeople(fig,g); scene.add(fig);
  const lg=G[st.sex+'l']; if(lg&&fig.userData.rig)lg.scene.traverse(o=>{if(o.isSkinnedMesh&&o.morphTargetDictionary)fig.userData.rig.lightSrc=o;});
  setPeople(fig,P.shape); mixer=new THREE.AnimationMixer(fig); playPeople(fig,mixer,clip);
  shape(); dress();
}
function shape(){
  const P=PEOPLE[st.people], r=st.sex==='f'?P.f:P.m, h=lerp(r.h,st.h), w=lerp(r.w,st.w);
  fig.scale.setScalar(h); setBuild(fig,Math.max(0,-w),Math.max(0,w)); if(fig.userData.rig&&fig.userData.rig.body.userData.baked)dressOutfit(fig,look(),outfit(),R,true);
  const tall=(fig.userData.rig&&fig.userData.rig.joints?1:0);
  document.getElementById('hv').textContent=Math.round(h*(st.sex==='f'?174:181)*(P.shape==='Ferrin'&&st.sex==='m'?0.83:1))+' cm';
  document.getElementById('bv').textContent=w<-0.6?'slight':w<-0.25?'slim':w<0.2?'fit':w<0.6?'sturdy':'heavy';
  document.getElementById('tag').innerHTML=st.people+'<small>'+(st.sex==='f'?'Woman':'Man')+' · '+P.desc+'</small>';
  frame();
}
function frame(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;const s=fig?fig.scale.y:1;
  if(st.view==='face'){cam.fov=16;cam.position.set(0,1.62*s,1.25);cam.lookAt(0,1.58*s,0);}
  else{cam.fov=28;const d=Math.max(4.6,2.2/Math.tan(14*Math.PI/180)/Math.max(0.6,cam.aspect)*0.55);cam.position.set(0,1.0,d);cam.lookAt(0,0.92,0);}
  if(innerWidth>700&&st.view!=='face'){cam.setViewOffset(w,h,w*0.12,0,w,h);}else cam.clearViewOffset();
  cam.updateProjectionMatrix();}
addEventListener('resize',frame);
// ---- controls
function chips(id,items,get,set,swatch){const el=document.getElementById(id);el.innerHTML='';items.forEach(([label,val],i)=>{const b=document.createElement('button');
  if(swatch){b.className='sw';b.style.background=label;b.setAttribute('aria-label',id+' colour '+(i+1));}else b.textContent=label;
  b.setAttribute('aria-pressed',String(get()===val));b.onclick=()=>{set(val);el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};el.appendChild(b);});}
function build(){
  const P=PEOPLE[st.people];
  chips('sex',[['Man','m'],['Woman','f']],()=>st.sex,v=>{st.sex=v;if(v==='f'&&!['Long','Ponytail','Topknot','Swept'].includes(st.hair))st.hair='Long';build();body();});
  chips('people',Object.keys(PEOPLE).map(k=>[k,k]),()=>st.people,v=>{st.people=v;st.skin=1;st.hcol=0;st.eye=0;build();body();});
  document.getElementById('pdesc').textContent=P.desc;
  chips('skin',P.skin.map((c,i)=>[c,i]),()=>st.skin,v=>{st.skin=v;dress();shape();},true);
  chips('eyes',P.eyes.map((c,i)=>[c,i]),()=>st.eye,v=>{st.eye=v;dress();},true);
  chips('hair',HAIRS,()=>st.hair,v=>{st.hair=v;dress();});
  chips('hcol',P.hair.map((c,i)=>[c,i]),()=>st.hcol,v=>{st.hcol=v;dress();},true);
  document.getElementById('beardBox').classList.toggle('hidden',st.sex==='f');
  chips('stache',STACHES,()=>st.stache,v=>{st.stache=v;dress();});
  chips('lower',[['Trousers',0],['Boxers',1]],()=>st.lower,v=>{st.lower=v;dress();shape();});
  const gear=document.getElementById('gear'); gear.innerHTML='';
  for(const sl of EQ_SLOTS){
    const lab=document.createElement('div');lab.className='label';lab.textContent=sl.name;gear.appendChild(lab);
    const box=document.createElement('div');box.className='chips';box.id='slot_'+sl.id;gear.appendChild(box);
    if(sl.locked){const b=document.createElement('button');b.textContent='Locked';b.disabled=true;box.appendChild(b);
      const n=document.createElement('p');n.className='lock';n.textContent=sl.locked;gear.appendChild(n);continue;}
    chips('slot_'+sl.id,[['None',null]].concat((EQ_ITEMS[sl.id]||[]).map(i=>[i.name,i.id])),()=>st.gear[sl.id],v=>{st.gear[sl.id]=v;if(sl.id==='waist')build();dress();});
    const belt=sl.id==='waist'&&eqItem('waist',st.gear.waist);
    if(belt&&belt.sockets){   // what hangs from each of the belt's sockets
      for(const sk of belt.sockets){const l=document.createElement('div');l.className='label sub2';l.textContent='On the belt: '+EQ_SOCKETS[sk].name;gear.appendChild(l);
        const b=document.createElement('div');b.className='chips';b.id='sock_'+sk;gear.appendChild(b);
        chips('sock_'+sk,EQ_ATTACH,()=>st.belt[sk]||null,v=>{st.belt[sk]=v;dress();});}
      const n=document.createElement('p');n.className='lock';n.textContent='Relics will hang from these too, once you find them.';gear.appendChild(n);}
  }
  chips('dye',EQ_DYES.map(([n],i)=>[n,i]),()=>st.dye,v=>{st.dye=v;dress();});
  chips('view',[['Full','full'],['Face','face'],['Walk','walk'],['Turntable','spin']],()=>st.view==='face'?'face':clip==='Walk'?'walk':'full',v=>{
    if(v==='spin'){spin=!spin;return;} if(v==='walk'){clip=clip==='Walk'?'Idle':'Walk';playPeople(fig,mixer,clip);return;} st.view=v;frame();});
  let hasShape=P.shape==='Human'; if(G[st.sex])G[st.sex].scene.traverse(o=>{if(o.morphTargetDictionary&&P.shape in o.morphTargetDictionary)hasShape=true;});
  document.getElementById('note').textContent=st.sex==='f'&&!hasShape?'Women share one body for now: the '+st.people+' women\'s own shape is still to come, so only height and build change here.':'Every people is one body with a built-in shape; the skeleton moves to match it, so the same animations, hair and clothing fit everyone.';
}
document.getElementById('height').oninput=e=>{st.h=+e.target.value;shape();};
document.getElementById('build').oninput=e=>{st.w=+e.target.value;shape();};
document.getElementById('rand').onclick=()=>{const ks=Object.keys(PEOPLE),P=PEOPLE[st.people=ks[Math.floor(Math.random()*ks.length)]];
  st.h=Math.random();st.w=Math.random();st.skin=Math.floor(Math.random()*P.skin.length);st.hcol=Math.floor(Math.random()*P.hair.length);st.eye=Math.floor(Math.random()*4);
  const hs=st.sex==='f'?['Long','Ponytail','Topknot','Swept']:['Short','Swept','Ponytail','Long','Topknot',null];st.hair=hs[Math.floor(Math.random()*hs.length)];
  st.beard=null;st.stache=Math.random()<0.4?STACHES[1+Math.floor(Math.random()*5)][1]:null;
  document.getElementById('height').value=st.h;document.getElementById('build').value=st.w;build();body();};
let drag=null;cv.addEventListener('pointerdown',e=>{drag=e.clientX;spin=false;cv.setPointerCapture(e.pointerId);});cv.addEventListener('pointermove',e=>{if(drag!==null){yaw+=(e.clientX-drag)*0.01;drag=e.clientX;}});cv.addEventListener('pointerup',()=>drag=null);
const BODY_FILES=new URLSearchParams(location.search).get('body')==='old'?[['m','male.gltf.json'],['f','female_cc.gltf.json']]:[['m','mh_m.gltf.json'],['f','mh_f.gltf.json'],['ml','mh_m_lod.gltf.json'],['fl','mh_f_lod.gltf.json']];
Promise.all(BODY_FILES.map(([k,f])=>new Promise((res,rej)=>new THREE.GLTFLoader().load(f,g=>{preparePainted(g);G[k]=g;res();},undefined,rej)))).then(()=>{
  document.getElementById('status').remove(); build(); body();
  (function loop(){requestAnimationFrame(loop);const dt=Math.min(0.05,clock.getDelta());if(spin)yaw+=dt*0.35;if(fig){fig.rotation.y=yaw;mixer.update(dt);buildPosture(fig);eqClothUpdate(fig,dt);}R.render(scene,cam);})();
}).catch(()=>{document.getElementById('status').textContent='Could not load the bodies.';});
</script>
