<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fogwright Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: full-bleed 3D world; HUD pinned to the four corners inside the safe areas */
:root{
  --ink:#efe9dc;
  --ink-dim:#bdb5a6;
  --panel:rgba(27,25,33,.76);
  --panel-line:rgba(239,233,220,.16);
  --brass:#d6a54e;
  --fog:#ae9be0;
  --ground:#1c1b21;
  --font-display:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --font-ui:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--ground);color:var(--ink);font-family:var(--font-ui);
  overflow:hidden;touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;z-index:5;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:10px 12px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tl{top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);max-width:calc(100vw - 180px)}
.title{font-family:var(--font-display);font-size:21px;letter-spacing:.05em;line-height:1;white-space:nowrap}
.title span{font-family:var(--font-ui);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);margin-left:6px;vertical-align:2px}
.biome{font-size:16px;font-weight:700;margin-top:7px;display:flex;align-items:center;gap:7px}
.biome i{width:10px;height:10px;border-radius:3px;background:var(--brass);display:inline-block;flex:none}
.meta{font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums;margin-top:3px}
.fogbar{margin-top:7px;height:4px;border-radius:2px;background:rgba(239,233,220,.12);overflow:hidden}
.fogbar b{display:block;height:100%;width:0;background:var(--fog);transition:width .3s}
.tr{top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.btnrow{display:flex;gap:8px;pointer-events:auto}
button{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--panel);border:1px solid var(--panel-line);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button[aria-pressed="true"]{background:rgba(214,165,78,.24);border-color:var(--brass);color:#fff4dc}
.gear{pointer-events:auto;width:min(270px, calc(100vw - 32px))}
.gear h2{font-family:var(--font-display);font-weight:400;font-size:17px;margin:0;letter-spacing:.04em}
.gear p{margin:2px 0 0;font-size:12.5px;color:var(--ink-dim)}
.label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin:11px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:36px;padding:6px 12px;font-size:13.5px}
.fps{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.bl{left:calc(env(safe-area-inset-left,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);font-size:13.5px;color:var(--ink);transition:opacity .6s}
.bl.gone{opacity:0}
.br{right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 34px)}
.compass{width:84px;height:84px;border-radius:50%;background:var(--panel);border:1px solid var(--panel-line);position:relative}
.compass svg{position:absolute;inset:0;width:100%;height:100%}
.compass .lbl{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-size:11.5px;color:var(--ink-dim);text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
#stick{position:fixed;z-index:6;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(239,233,220,.35);background:rgba(27,25,33,.25);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(239,233,220,.55);border:2px solid rgba(255,255,255,.7)}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:9;background:var(--ground);font-family:var(--font-display);font-size:22px;letter-spacing:.06em;color:var(--ink-dim);text-align:center;padding:24px}
[hidden]{display:none!important}
.meters{display:grid;gap:5px;margin-top:8px}
.meter{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-dim)}
.meter b{height:6px;border-radius:3px;background:rgba(239,233,220,.12);overflow:hidden;display:block}
.meter i{display:block;height:100%;width:100%;background:var(--c);transition:width .2s}
.meter[data-low] span{color:#ff9a8a}
.inv{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:min(300px, calc(100vw - 200px))}
.chip{background:var(--panel);border:1px solid var(--panel-line);border-radius:999px;padding:4px 10px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{font-weight:700;margin-left:2px}
.chip[data-off]{opacity:.38}
.actions{right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 150px)}
.actrow{display:flex;gap:8px;align-items:flex-end;pointer-events:auto}
.bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;pointer-events:auto}
.bar button{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:6px 11px;border-radius:12px}
.bar small{font-size:11px;color:var(--ink-dim);font-weight:400}
.bar button[data-short] small{color:#ff9a8a}
button:disabled{opacity:.4;cursor:default}
#useBtn{width:76px;height:76px;border-radius:50%;font-weight:700;font-size:15px;background:#8a6428;border-color:#e0b25c;color:#fff4dc;touch-action:none}
#useBtn:active{background:#a8792f}
.actions button{background:rgba(27,25,33,.88)}
.actions button[aria-pressed="true"]{background:#6e5124;border-color:var(--brass);color:#fff4dc}
.prompt{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 110px);background:var(--panel);border:1px solid var(--panel-line);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast{left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-8px);background:rgba(214,165,78,.92);color:#1d1a14;font-weight:700;border-radius:999px;padding:7px 16px;font-size:14px;opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){.prompt{font-size:13px}.toast{top:calc(env(safe-area-inset-top,0px) + 186px)}}
@media (max-width:520px){
  .title{font-size:18px}
  .tl{max-width:calc(100vw - 150px)}
  button{padding:7px 12px;font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){.bl,.fogbar b{transition:none}}
[hidden]{display:none!important}
.pframe{top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 12px);width:220px;background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:8px 10px;display:grid;gap:4px}
.prow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-dim)}
.prow b{font-family:var(--font-display);font-weight:400;font-size:17px;color:var(--ink);letter-spacing:.03em}
.hb{position:relative;height:12px;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden}
.hb i{position:absolute;inset:0 auto 0 0;background:#c9453b;transition:width .15s}
.hb span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:12px;font-weight:700;color:#fff;text-shadow:0 1px 1px #000;font-variant-numeric:tabular-nums}
.hb.en{height:6px}.hb.en i{background:#46a6d8}
.hb.xp{height:3px}.hb.xp i{background:var(--brass)}
.tframe{top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);width:min(300px,36vw);background:var(--panel);border:1px solid rgba(201,69,59,.5);border-radius:10px;padding:8px 10px;display:grid;gap:4px}
.tframe .hb{height:14px}.tframe .hb span{line-height:14px}
.tracker{top:calc(env(safe-area-inset-top,0px) + 92px);left:calc(env(safe-area-inset-left,0px) + 12px);max-width:240px;display:grid;gap:2px;font-size:12.5px;color:var(--ink);text-shadow:0 1px 2px #000}
.tracker b{color:#ffd24a;font-size:13px}
.topright{top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:8px;align-items:center}
.topright .meta{margin:0;font-size:12px;color:var(--ink);text-shadow:0 1px 2px #000;display:flex;align-items:center;gap:4px;white-space:nowrap}
.topright .meta i{width:8px;height:8px;border-radius:2px;display:inline-block}
.topright button{pointer-events:auto;min-height:38px}
#ebars,#numbers{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.ebar{position:absolute;left:0;top:0;width:60px;height:6px;background:rgba(0,0,0,.55);border-radius:2px;overflow:hidden;border:1px solid rgba(0,0,0,.6)}
.ebar i{display:block;height:100%;background:#d24b3f}
.ebar.tgt{outline:2px solid #ffd24a;outline-offset:1px}
.ebar.elite{width:90px;height:8px}.ebar.elite i{background:#b061e0}
.num{position:absolute;left:0;top:0;font-weight:800;font-size:16px;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap;will-change:transform}
.num.crit{color:#ffd24a;font-size:21px}.num.hurt{color:#ff6a5a}.num.heal{color:#7fe08a}.num.xp{color:#c58bff;font-size:13px}.num.shard{color:#a8d8ff;font-size:13px}
.skills{right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:250px;height:200px;pointer-events:none}
#crosshair{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid rgba(255,255,255,.85);border-radius:50%;z-index:6;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
#crosshair::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff;border-radius:50%}
#crosshair.on{border-color:#ff6a5a}
#skCancel{right:calc(env(safe-area-inset-right,0px) + 40px);top:calc(env(safe-area-inset-top,0px) + 64px);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(27,25,33,.85);border:2px dashed rgba(255,106,90,.7);color:#ffb0a6;font-size:12px;font-weight:700}
#skCancel.hot{background:#8a3a2c;color:#fff}
.skills button{position:absolute;pointer-events:auto;touch-action:none;padding:0;-webkit-tap-highlight-color:transparent}
.atk{right:0;bottom:0;width:88px;height:88px;border-radius:50%;background:#8a3a2c!important;border:2px solid #e0b25c!important;color:#fff4dc!important;font-weight:800;font-size:15px}
.atk.on{box-shadow:0 0 0 4px rgba(255,210,74,.45)}
.sk{width:58px;height:58px;border-radius:50%;background:rgba(27,25,33,.9);border:1.5px solid rgba(239,233,220,.35);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-size:11px;line-height:1.05;--p:0%}
.sk span{font-weight:700;text-align:center;max-width:52px}
.sk em{font-style:normal;font-size:10px;color:#7fc4ef}
.sk::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.68) var(--p),transparent 0)}
.sk .cdn{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff;z-index:1;text-shadow:0 1px 2px #000}
.sk[data-low] em{color:#ff8a7a}
.nextbtn{width:48px;height:48px;border-radius:50%;font-size:10px;line-height:1.1;background:rgba(27,25,33,.85)}
.interact{right:calc(env(safe-area-inset-right,0px) + 280px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);pointer-events:auto;min-height:52px;padding:0 22px;font-weight:700;font-size:15px;background:#6e5124!important;border-color:var(--brass)!important;color:#fff4dc}
.buildui{right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:min(520px,calc(100vw - 260px))}
.buildui .mats{font-size:13px;background:var(--panel);border:1px solid var(--panel-line);border-radius:999px;padding:4px 12px}
.pieces,.brow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
.pieces button{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:6px 10px;border-radius:12px;background:rgba(27,25,33,.9)}
.pieces small{font-size:10.5px;color:var(--ink-dim)}
.pieces button[data-short] small{color:#ff9a8a}
.pieces button[aria-pressed="true"]{background:#6e5124;border-color:var(--brass)}
.buildui .atk{position:static;width:76px;height:76px}
.prompt{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--panel);border:1px solid var(--panel-line);border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
.toast{left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-8px);background:rgba(214,165,78,.94);color:#1d1a14;font-weight:700;border-radius:999px;padding:6px 16px;font-size:14px;opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.bl{max-width:40vw}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(10,9,14,.55);padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mcard{background:#22202a;border:1px solid var(--panel-line);border-radius:14px;padding:14px 16px;width:min(780px,100%);max-height:100%;overflow:auto;color:var(--ink)}
.mcard.small{width:min(440px,100%)}
.mhead{display:flex;justify-content:space-between;align-items:center}
.mcard h2{font-family:var(--font-display);font-weight:400;font-size:24px;margin:0}
.mcard h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin:12px 0 6px}
.mcard .chips{display:flex;flex-wrap:wrap;gap:6px}
.mcard .chips button{min-height:36px;font-size:13px}
.mcard .sub{font-size:12.5px;color:var(--ink-dim);margin:4px 0}
.mcard p{line-height:1.45}
.giver{margin:0;color:#ffd24a;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
@media (max-width:620px){.cols{grid-template-columns:1fr}}
.slot,.item{background:rgba(255,255,255,.04);border:1px solid var(--panel-line);border-radius:8px;padding:6px 8px;margin-bottom:6px;display:grid;gap:1px}
.slot .slabel{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.slot small,.item small{display:block;font-size:11.5px;color:var(--ink-dim)}
.item{grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:6px}
.item button{min-height:34px;padding:4px 10px;font-size:12.5px}
.cmp{font-size:11.5px;font-weight:700}.cmp.up{color:#7fe08a}.cmp.down{color:#ff8a7a}
.empty{font-size:13px;color:var(--ink-dim)}
#craftRow button{font-size:12.5px;min-height:34px}
.brow{margin-top:10px}
.primary{background:#6e5124!important;border-color:var(--brass)!important;color:#fff4dc}
#rotate{position:fixed;inset:0;z-index:50;background:#16151b;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink)}
#rotate b{font-family:var(--font-display);font-weight:400;font-size:26px;display:block}
#rotate p{color:var(--ink-dim)}
</style>

<canvas id="world" aria-label="Fogwright world view" tabindex="0"></canvas>
<div id="loading">Raising the world…</div>

<div class="hud pframe" id="pframe">
  <div class="prow"><b class="pname">Tinker</b><span id="pLevel">Lv 1</span></div>
  <div class="hb hp"><i id="pHp"></i><span id="pHpTxt"></span></div>
  <div class="hb en"><i id="pEn"></i></div>
  <div class="hb xp"><i id="pXp"></i></div>
</div>
<div class="hud tracker" id="tracker" hidden><b id="qTitle"></b><span id="qObj"></span></div>
<div class="hud tframe" id="tframe" hidden>
  <div class="prow"><b id="tName"></b><span id="tLevel"></span></div>
  <div class="hb hp"><i id="tHp"></i><span id="tHpTxt"></span></div>
</div>
<div class="hud topright">
  <span class="meta"><i id="biomeSwatch"></i><span id="biomeName">Meadow</span> · <span id="clock">Day 1</span> · <span class="fps" id="fps"></span></span>
  <button id="ctrlBtn" hidden>Classic controls</button>
  <button id="adminBtn">Admin</button>
  <button id="lanternBtn" aria-pressed="false">Lantern</button>
  <button id="bagBtn">Bag</button>
  <button id="buildBtn" aria-pressed="false">Build</button>
</div>
<div hidden><span id="metaLine"></span><b id="fogFill"></b><button id="gearBtn"></button><div id="gearPanel"><div id="presets"></div><div id="worn"></div><div id="weapons"></div></div><button id="newBtn"></button></div>
<div class="hud bl" id="hint">Left thumb moves · tap an enemy or Attack to fight · skills sit around Attack</div>
<div class="hud prompt" id="prompt" hidden></div>
<div class="hud toast" id="toast" role="status"></div>
<div id="ebars" aria-hidden="true"></div>
<div id="numbers" aria-hidden="true"></div>
<div id="crosshair" hidden aria-hidden="true"></div>
<div id="skCancel" class="hud" hidden>Cancel</div>
<button class="hud interact" id="interactBtn" hidden>Talk</button>
<div class="hud skills" id="skills">
  <button class="sk" data-sk="patch" style="right:186px;bottom:15px" aria-label="Patch kit, heal over time"><span>Patch</span><em>20</em><b class="cdn"></b></button>
  <button class="sk" data-sk="shot" style="right:115px;bottom:15px" aria-label="Overcharged shot"><span>Over&shy;charge</span><em>25</em><b class="cdn"></b></button>
  <button class="sk" data-sk="shock" style="right:86px;bottom:86px" aria-label="Shock canister, area damage and slow"><span>Shock</span><em>30</em><b class="cdn"></b></button>
  <button class="sk" data-sk="dash" style="right:15px;bottom:115px" aria-label="Steam dash"><span>Dash</span><em>15</em><b class="cdn"></b></button>
  <button class="sk" data-sk="turret" style="right:160px;bottom:78px" aria-label="Gear turret"><span>Turret</span><em>30</em><b class="cdn"></b></button>
  <button class="nextbtn" id="tgtBtn" style="right:150px;bottom:146px">Next<br>target</button>
  <button class="atk" id="atkBtn">Attack</button>
</div>
<div class="hud buildui" id="buildUi" hidden>
  <div class="mats">Wood <b id="bWood">0</b> · Stone <b id="bStone">0</b></div>
  <div class="pieces">
    <button data-piece="floor" aria-pressed="true">Floor<small>4 wood</small></button>
    <button data-piece="wall" aria-pressed="false">Wall<small>4 wood</small></button>
    <button data-piece="stonewall" aria-pressed="false">Stone wall<small>6 stone</small></button>
    <button data-piece="fire" aria-pressed="false">Campfire<small>3 wood · 2 stone</small></button>
    <button data-piece="remove" aria-pressed="false">Remove<small>refunds half</small></button>
  </div>
  <div class="brow"><button id="rotBtn">Rotate</button><button id="buildDone">Done</button><button id="placeBtn" class="atk">Place</button></div>
</div>
<div class="modal" id="bagPanel" hidden>
  <div class="mcard">
    <div class="mhead"><h2>Tinker</h2><button id="bagClose">Close</button></div>
    <p id="bagStats" class="sub"></p>
    <div class="cols">
      <section>

// colour every grid corner once; triangles blend between their corners so edges are soft

// Instances are batched per block of the map, not per city: the far blocks and the ones behind the camera are skipped,
// and only blocks near the player cast shadows. One batch per house type for the whole city drew all of it from anywhere.
const CELLS=[], CELL=64, SHADOW_NEAR=70;
function cellInstances(geo,mat,list,far,big,tinted){ // list of {x,y,z,ry,sx,tint}
  if(!geo||!list.length)return; if(!geo.boundingSphere)geo.computeBoundingSphere();
  const groups=new Map();
  for(const p of list){const k=big?'all':Math.floor(p.x/CELL)+','+Math.floor(p.z/CELL);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p);}
  for(const sub of groups.values()){
    const m=new THREE.InstancedMesh(geo,mat,sub.length), c=new THREE.Color(), ctr=new THREE.Vector3();
    sub.forEach((p,i)=>{tmpObj.position.set(p.x,p.y,p.z);tmpObj.rotation.set(0,p.ry||0,0);tmpObj.scale.set(p.sx||1,1,1);tmpObj.updateMatrix();m.setMatrixAt(i,tmpObj.matrix);
      if(tinted){const t=p.tint||[1,1,1];m.setColorAt(i,c.setRGB(t[0],t[1],t[2]));} ctr.x+=p.x/sub.length;ctr.y+=p.y/sub.length;ctr.z+=p.z/sub.length;});
    let r=0; for(const p of sub)r=Math.max(r,Math.hypot(p.x-ctr.x,p.y-ctr.y,p.z-ctr.z)); r+=geo.boundingSphere.radius*Math.max(1,...sub.map(p=>p.sx||1))+Math.hypot(...geo.boundingSphere.center.toArray());
    m.instanceMatrix.needsUpdate=true; if(m.instanceColor)m.instanceColor.needsUpdate=true; m.frustumCulled=false; m.receiveShadow=true;
    landmarks.add(m); CELLS.push({m,sphere:new THREE.Sphere(ctr,r),far,shadow:true});
  }
}
function kitInstances(name,list){cellInstances(KIT.geo[name],kitMat,list,/WallSeg|Tower|Gatehouse/.test(name)?1e9:360,/WallSeg|Tower|Gatehouse/.test(name),true);}
const _frustum=new THREE.Frustum(), _pm=new THREE.Matrix4();
function cullCells(){
  camera.updateMatrixWorld(); _pm.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse); _frustum.setFromProjectionMatrix(_pm);
  for(const c of CELLS){const d=Math.hypot(c.sphere.center.x-player.x,c.sphere.center.z-player.z)-c.sphere.radius;
    c.m.visible=d<c.far&&(d<SHADOW_NEAR||_frustum.intersectsSphere(c.sphere)); c.m.castShadow=c.shadow&&d<SHADOW_NEAR;}
}

function streetPointNear(){
  const pa=Math.atan2(player.z-CITY.z,player.x-CITY.x), pr=Math.hypot(player.x-CITY.x,player.z-CITY.z);
  if(Math.random()<0.6){const R=RINGS.reduce((b,r)=>Math.abs(r-pr)<Math.abs(b-pr)?r:b),a=pa+(Math.random()-0.5)*130/R;return {ring:true,r:R+(Math.random()-0.5)*13,a};}

  return {ring:false,a:av,r:Math.max(CITY.core+26,Math.min(CITY.r-8,pr+(Math.random()-0.5)*110))};
}
function crowdUpdate(dt,now,night){
  const inCity=Math.hypot(player.x-CITY.x,player.z-CITY.z)<CITY.r+40, want=inCity?Math.round(34*(1-0.75*night)):0;
  while(crowd.length<want){const sp=streetPointNear();crowd.push({...sp,off:(Math.random()-0.5)*16,dir:Math.random()<0.5?1:-1,speed:1+Math.random()*0.7,mesh:makePerson(false),phase:Math.random()*6});}
  while(crowd.length>want){const p=crowd.pop();scene.remove(p.mesh);}
  for(const p of crowd){
    if(p.ring)p.a+=p.dir*p.speed*dt/p.r; else {p.r+=p.dir*p.speed*dt; if(p.r>CITY.r-6||p.r<CITY.core+24)p.dir*=-1;}
    const a=p.a, x=CITY.x+Math.cos(a)*p.r+(p.ring?0:-Math.sin(a)*p.off), z=CITY.z+Math.sin(a)*p.r+(p.ring?0:Math.cos(a)*p.off);
    if(Math.hypot(x-player.x,z-player.z)>95){Object.assign(p,streetPointNear());continue;}
    const dx=x-player.x,dz=z-player.z,d=Math.hypot(dx,dz),px=d<1.1?x+dx/d*(1.1-d):x,pz=d<1.1?z+dz/d*(1.1-d):z;

function placeName(x,z){
  if(Math.hypot(x-VILLAGE.x,z-VILLAGE.z)<58)return 'The village';
  if(Math.hypot(x-PORT.x,z-PORT.z)<80)return "Hollin's Cross";
  const dc=Math.hypot(x-CITY.x,z-CITY.z);
  if(dc<CITY.core+26)return 'The grand plaza';
  const [mx,mz]=marketPos(); if(Math.hypot(x-mx,z-mz)<MARKET.rad+6)return 'The market square';
  if(dc<CITY.r)return quarterOf(Math.atan2(z-CITY.z,x-CITY.x)).name;
  if(dc<CITY.r+55&&Math.abs(x-CITY.x)<30)return 'The gate checkpoint';
  if(inOutskirts(x,z))return 'The outskirts';
  if(dc<CITY.r+55)return 'Outside the city walls';
  if(islandE(x,z)>1)return 'The inner sea';
  if(roadDist(x,z)<8)return 'The south road';
  return BIOMES[biomeIndex(warpDist(x,z))].name;
}

const cam={yaw:0.6,pitch:0.55,dist:11};
const input={x:0,y:0}, keys=new Set();
const stickEl=document.getElementById('stick'), knobEl=document.getElementById('knob'), hint=document.getElementById('hint');
let stick=null; const looks=new Map(); let pinch0=0, dist0=0, moved=false;
if(!coarse)hint.textContent='WASD move · click an enemy or Space to attack · 1-4 skills · Tab next target · E interact · I bag · B build';
canvas.addEventListener('pointerdown',e=>{
  if(P.ctrl==='action'&&e.pointerType==='mouse'){if(!P.locked)actionMouseDown(e);return;}
  canvas.setPointerCapture(e.pointerId);
  if(e.pointerType!=='mouse'&&!stick&&e.clientX<innerWidth*0.5){
    stick={id:e.pointerId,ox:e.clientX,oy:e.clientY,t0:performance.now(),m:0};
    stickEl.hidden=false;stickEl.style.opacity='1';stickEl.style.left=e.clientX+'px';stickEl.style.top=e.clientY+'px';knobEl.style.transform='';
    return;
  }
  looks.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t0:performance.now()});
  if(looks.size===2){const [a,b]=[...looks.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);dist0=cam.dist;}
});
canvas.addEventListener('pointermove',e=>{
  if(stick&&e.pointerId===stick.id){
    let dx=e.clientX-stick.ox, dy=e.clientY-stick.oy; const m=Math.hypot(dx,dy), R=50;
    stick.m=Math.max(stick.m,m); if(m>R){dx*=R/m;dy*=R/m;}
    knobEl.style.transform=`translate(${dx}px,${dy}px)`; input.x=dx/R; input.y=dy/R; return;
  }
  const p=looks.get(e.pointerId); if(!p)return;
  if(looks.size===1){
    cam.yaw-=(e.clientX-p.x)*0.006; cam.pitch=Math.min(1.35,Math.max(0.12,cam.pitch+(e.clientY-p.y)*0.004));
  }
  p.x=e.clientX;p.y=e.clientY;
  if(looks.size===2){const [a,b]=[...looks.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0>0)cam.dist=Math.min(45,Math.max(4,dist0*pinch0/d));}
});
function endPointer(e){
  if(stick&&e.pointerId===stick.id){const tap=stick.m<10&&performance.now()-stick.t0<280;stick=null;restStick();input.x=input.y=0;if(tap&&e.type==='pointerup')onTap(e.clientX,e.clientY);return;}
  const lp=looks.get(e.pointerId);
  if(lp&&looks.size===1&&e.type==='pointerup'&&Math.hypot(lp.x-lp.sx,lp.y-lp.sy)<10&&performance.now()-lp.t0<320)onTap(e.clientX,e.clientY);
  looks.delete(e.pointerId); pinch0=0;
}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);

// resources in chunks
function hideRes(e){for(const m of e.layers){tmpObj.position.set(0,-999,0);tmpObj.scale.set(0,0,0);tmpObj.updateMatrix();m.setMatrixAt(e.idx,tmpObj.matrix);m.instanceMatrix.needsUpdate=true;}}
function registerRes(cx,cz,group,L,layers){
  group.userData.res=[];
  for(const kind in HARVEST){
    const items=L[kind]; if(!items||!layers[kind])continue;
    items.forEach((it,idx)=>{
      const e={id:cx+','+cz+','+kind+','+idx,kind,x:it.x,z:it.z,r:kind==='rock'?0.9*it.sx:0.6,layers:layers[kind],idx};
      if(game.removed.has(e.id)){e.gone=true;hideRes(e);}
      group.userData.res.push(e);
    });
  }
}
function nearbyRes(){
  const ccx=Math.floor(player.x/CS), ccz=Math.floor(player.z/CS), fx=Math.sin(player.face), fz=Math.cos(player.face);
  let best=null, bd=1e9;
  for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){
    const g=chunks.get((ccx+dx)+','+(ccz+dz)); if(!g||!g.userData.res)continue;
    for(const e of g.userData.res){
      if(e.gone)continue;
      const ex=e.x-player.x, ez=e.z-player.z, d=Math.hypot(ex,ez)-e.r;
      if(d>2.4)continue;
      const front=(ex*fx+ez*fz)/Math.max(0.01,Math.hypot(ex,ez));
      const score=d-front*0.3; if(score<bd){bd=score;best=e;}
    }
  }
  return best;
}

const LEVEL=0.25, snapUp=v=>Math.ceil(v/LEVEL-1e-6)*LEVEL;
function floorTopAt(x,z){let top=-Infinity;for(const p of game.pieces)if(p.t==='floor'&&Math.abs(x-p.x)<=1.001&&Math.abs(z-p.z)<=1.001)top=Math.max(top,p.y);return top;}
function groundAt(x,z){return Math.max(heightAt(x,z),floorTopAt(x,z));}
function snapPiece(t,px,pz,rot){
  if(t==='floor'){
    const x=Math.round((px-1)/2)*2+1, z=Math.round((pz-1)/2)*2+1;
    const hs=[heightAt(x-1,z-1),heightAt(x+1,z-1),heightAt(x-1,z+1),heightAt(x+1,z+1),heightAt(x,z)];
    let y=snapUp(Math.max(...hs)+0.1);
    // join the level of a neighbouring floor so a building stays flat
    let best=null;
    for(const q of game.pieces)if(q.t==='floor'&&Math.abs(q.x-x)+Math.abs(q.z-z)<=4.01&&Math.abs(q.y-y)<=1.26)if(!best||q.y>best.y)best=q;
    if(best&&best.y>=Math.max(...hs)-0.05)y=best.y;
    return {t,x,z,rot:0,y,base:Math.min(...hs)-0.6};
  }
  if(t==='wall'||t==='stonewall'){
    let x,z; if(rot){x=Math.round(px/2)*2;z=Math.round((pz-1)/2)*2+1;}else{x=Math.round((px-1)/2)*2+1;z=Math.round(pz/2)*2;}
    const ax=rot?0:1, az=rot?1:0;
    const hs=[heightAt(x-ax,z-az),heightAt(x,z),heightAt(x+ax,z+az)];
    const fl=Math.max(floorTopAt(x+az*0.5,z+ax*0.5),floorTopAt(x-az*0.5,z-ax*0.5));
    let bottom=isFinite(fl)?fl:snapUp(Math.max(...hs));
    // walls that meet end to end share one height
    const ends=[[x-ax,z-az],[x+ax,z+az]];
    for(const q of game.pieces){
      if(q.t!=='wall'&&q.t!=='stonewall')continue;
      const qa=q.rot?0:1, qb=q.rot?1:0, qe=[[q.x-qa,q.z-qb],[q.x+qa,q.z+qb]];
      const touch=ends.some(e=>qe.some(f=>Math.abs(e[0]-f[0])<0.01&&Math.abs(e[1]-f[1])<0.01));
      if(touch&&Math.abs(q.y-bottom)<=1.26&&q.y>=Math.max(...hs)-0.3){bottom=q.y;break;}
    }
    return {t,x,z,rot,y:bottom,base:Math.min(...hs)-0.4,top:bottom+2.5};
  }
  if(t==='fire'){const x=Math.round(px*2)/2, z=Math.round(pz*2)/2;return {t,x,z,rot:0,y:groundAt(x,z),base:0};}
  return null;
}
function pieceMesh(p,ghost){
  const g=new THREE.Group();
  if(p.t==='floor'){
    const h=p.y-p.base; g.add(box(2,h,2,timber,p.x,(p.y+p.base)/2,p.z));
    for(const o of[-0.5,0.5])g.add(box(2,0.02,0.07,timberDark,p.x,p.y+0.01,p.z+o));
  }else if(p.t==='wall'||p.t==='stonewall'){
    const h=p.top-p.base, cy=(p.top+p.base)/2, ry=p.rot?Math.PI/2:0, ax=p.rot?0:1, az=p.rot?1:0;
    if(p.t==='wall'){
      g.add(box(2,h,0.2,timber,p.x,cy,p.z,ry));
      for(const s of[-1,1])g.add(box(0.26,h+0.08,0.28,timberDark,p.x+ax*s*0.95,cy+0.04,p.z+az*s*0.95,ry));
      g.add(box(2,0.18,0.26,timberDark,p.x,p.top-0.4,p.z,ry));
    }else{
      g.add(box(2,h,0.36,stone,p.x,cy,p.z,ry));
      g.add(box(2.06,0.16,0.44,stoneDark,p.x,p.top+0.02,p.z,ry));
    }
  }else if(p.t==='fire'){
    g.add(box(1.4,0.22,0.26,timberDark,p.x,p.y+0.13,p.z,0.6),box(1.4,0.22,0.26,timberDark,p.x,p.y+0.13,p.z,-0.6));
    const fl=new THREE.Mesh(new THREE.ConeGeometry(0.4,1.1,5),ghost?ghost:flameMat);fl.position.set(p.x,p.y+0.7,p.z);fl.userData.flame=true;g.add(fl);
    for(let i=0;i<7;i++){const a=i/7*Math.PI*2;const r=new THREE.Mesh(G.rock,stoneDark);r.position.set(p.x+Math.cos(a)*0.85,p.y-0.1,p.z+Math.sin(a)*0.85);r.scale.set(0.3,0.26,0.26);r.rotation.y=a;g.add(r);}
  }
  g.traverse(o=>{if(o.isMesh){if(ghost)o.material=ghost;else{o.castShadow=true;o.receiveShadow=true;}}});

}
function shiftPiece(q,d){q.y+=d;if(q.top!=null)q.top+=d;piecesGroup.remove(q._g);q._g=pieceMesh(q,null);piecesGroup.add(q._g);}
function levelFrom(p){
  // a building stands on one level: connected floors and the walls on them share the highest floor's height
  const group=[p], seen=new Set([p]);
  for(let i=0;i<group.length;i++){const a=group[i];
    for(const q of game.pieces)if(q.t==='floor'&&!seen.has(q)&&Math.abs(q.x-a.x)+Math.abs(q.z-a.z)<=2.01&&Math.abs(q.y-p.y)<=1.26){seen.add(q);group.push(q);}}
  const lvl=Math.max(...group.map(q=>q.y));
  for(const q of game.pieces){
    if(q.t!=='wall'&&q.t!=='stonewall')continue;
    const ax=q.rot?0:1, az=q.rot?1:0;
    const onGroup=group.some(f=>q.rot?(Math.abs(f.z-q.z)<0.01&&Math.abs(f.x-q.x)<=1.01):(Math.abs(f.x-q.x)<0.01&&Math.abs(f.z-q.z)<=1.01));
    if(onGroup&&q.y<lvl&&lvl-q.y<=1.26)shiftPiece(q,lvl-q.y);
  }
  for(const q of group)if(q.y<lvl)shiftPiece(q,lvl-q.y);
}
function addPiece(p){p._g=pieceMesh(p,null);piecesGroup.add(p._g);game.pieces.push(p);}
function removePiece(p){piecesGroup.remove(p._g);p._g.traverse(o=>{if(o.geometry&&o.geometry!==G.rock)o.geometry.dispose();});game.pieces.splice(game.pieces.indexOf(p),1);}
function clearPieces(){for(const p of game.pieces.slice())removePiece(p);}
const fireLights=[0,1,2].map(()=>{const l=new THREE.PointLight(0xffa050,0,18,2);scene.add(l);return l;});
function fires(){const list=[{x:CAMPFIRE.x,z:CAMPFIRE.z,camp:true}];for(const p of game.pieces)if(p.t==='fire')list.push(p);return list;}
function nearFire(r){for(const f of fires())if(Math.hypot(f.x-player.x,f.z-player.z)<r)return true;return false;}

function collide(){
  for(const w of game.pieces){
    if(w.t!=='wall'&&w.t!=='stonewall')continue;
    const dx=player.x-w.x, dz=player.z-w.z; if(dx*dx+dz*dz>9)continue;
    const ax=w.rot?0:1, az=w.rot?1:0, t=Math.max(-1,Math.min(1,dx*ax+dz*az));
    const qx=w.x+ax*t, qz=w.z+az*t; let ex=player.x-qx, ez=player.z-qz; const d=Math.hypot(ex,ez), R=w.t==='stonewall'?0.58:0.5;
    if(d<R){if(d<1e-4){ex=az;ez=ax;}else{ex/=d;ez/=d;}player.x=qx+ex*R;player.z=qz+ez*R;}
  }
  for(const c of colliders){
    if(c.type==='circle'){const dx=player.x-c.x,dz=player.z-c.z,d=Math.hypot(dx,dz),R=c.r+0.45;if(d<R&&d>1e-4){player.x=c.x+dx/d*R;player.z=c.z+dz/d*R;}continue;}
    const dx=player.x-c.x, dz=player.z-c.z; if(dx*dx+dz*dz>(c.hw+c.hd+2)**2)continue;
    const co=Math.cos(c.rot), si=Math.sin(c.rot), lx=dx*co-dz*si, lz=dx*si+dz*co, R=0.45, ex=c.hw+R-Math.abs(lx), ez=c.hd+R-Math.abs(lz);
    if(ex>0&&ez>0){let nx=lx,nz=lz; if(ex<ez)nx=Math.sign(lx)*(c.hw+R); else nz=Math.sign(lz)*(c.hd+R);

  }
}

function restStick(){

function useAction(){
  if(game.swingT>0||game.dead)return;
  if(game.build){placeOrRemove();return;}
  const e=game.target;
  if(e){
    const R=HARVEST[e.kind]; game.swingT=0.42; player.face=Math.atan2(e.x-player.x,e.z-player.z);
    if(game.targetId!==e.id){game.targetId=e.id;game.hits=0;}
    game.hits+=(R.tool&&game.tools[R.tool])?2:1;
    if(game.hits>=R.hits){
      for(const [k,v] of Object.entries(R.give))game.inv[k]+=v;
      e.gone=true;game.removed.add(e.id);hideRes(e);game.hits=0;game.targetId=null;game.autoId=null;
      toast('+'+costText(R.give));game.dirty=true;
    }
    return;
  }
  if(nearBench())toggleCraft(true);
}
function placeOrRemove(){
  const pl=game.place; if(!pl)return;
  if(game.piece==='remove'){
    if(!pl.hit)return;
    const c=PIECES[pl.hit.t].cost; for(const [k,v] of Object.entries(c))game.inv[k]+=Math.ceil(v/2);
    removePiece(pl.hit); toast('Removed, half refunded'); game.ghostKey=''; game.dirty=true; game.swingT=0.3; return;
  }
  if(!pl.ok){toast(pl.why);return;}
  pay(PIECES[pl.p.t].cost); const p={t:pl.p.t,x:pl.p.x,z:pl.p.z,rot:pl.p.rot,y:pl.p.y,base:pl.p.base,top:pl.p.top};
  addPiece(p); if(p.t==='floor')levelFrom(p); game.ghostKey=''; game.dirty=true; game.swingT=0.3;
}

  if(game.needs.hunger>=99){toast('Not hungry');return;}

  if(!canAfford(r.cost)){toast('Need '+costText(r.cost));return;}

function updateBuild(){
  const cfx=-Math.sin(cam.yaw), cfz=-Math.cos(cam.yaw), px=player.x+cfx*3.4, pz=player.z+cfz*3.4;
  if(!game.moving)player.face=Math.atan2(cfx,cfz);
  game.rot=(Math.abs(cfz)>=Math.abs(cfx)?0:1)^game.rotFlip;
  if(game.piece==='remove'){
    let hit=null,bd=3.2;for(const p of game.pieces){const d=Math.hypot(p.x-px,p.z-pz);if(d<bd){bd=d;hit=p;}}
    game.place={hit};const key='rm'+(hit?game.pieces.indexOf(hit)+':'+hit.x+':'+hit.z:'none');
    if(key!==game.ghostKey){game.ghostKey=key;setGhost(hit?pieceMesh(hit,ghostMatBad):null);if(game.ghost)game.ghost.scale.setScalar(1);}
    return;
  }
  const p=snapPiece(game.piece,px,pz,game.rot);
  let ok=true, why='';
  if(!canAfford(PIECES[p.t].cost)){ok=false;why='Need '+costText(PIECES[p.t].cost);}
  else if(game.pieces.some(q=>q.t===p.t&&Math.abs(q.x-p.x)<0.1&&Math.abs(q.z-p.z)<0.1&&q.rot===p.rot)){ok=false;why='Already built here';}
  else if(heightAt(p.x,p.z)<-0.3&&p.t!=='floor'){ok=false;why='Cannot build in water';}
  else if(Math.hypot(p.x-CAMPFIRE.x,p.z-CAMPFIRE.z)<2.2||Math.hypot(p.x-BENCH.x,p.z-BENCH.z)<2.2||Math.hypot(p.x+9,p.z-5)<7){ok=false;why='Too close to the camp';}
  else if(p.t!=='floor'&&p.t!=='fire'&&(p.top-p.base)>6){ok=false;why='Ground too steep';}
  game.place={p,ok,why};
  const key=[p.t,p.x,p.z,p.rot,ok,p.y.toFixed(2)].join(':');
  if(key!==game.ghostKey){game.ghostKey=key;setGhost(pieceMesh(p,ok?ghostMatOk:ghostMatBad));}
}

function coreUpdate(dt,now){
  // time of day
  game.time+=dt/DAY_LEN; if(game.time>=1){game.time-=1;game.day++;toast('Day '+game.day);}
  const dl=daylight(), night=1-dl, warmFire=nearFire(6.5), wet=heightAt(player.x,player.z)<-0.25;
  // needs
  const N=game.needs;
  if(!game.dead&&SURVIVAL){
    N.hunger=Math.max(0,N.hunger-dt*100/420);
    let dw=warmFire?5:(night>0.5?-1.15*night:1.2); if(wet)dw-=2.5; N.warmth=Math.max(0,Math.min(100,N.warmth+dw*dt));
    if(N.hunger<=0||N.warmth<=0)N.health-=dt*2.2; else if(N.hunger>40&&N.warmth>40)N.health=Math.min(100,N.health+dt*0.8);
    if(N.health<=0)collapse();
  }
  // targets and actions
  game.target=game.build?null:nearbyRes();
  if(game.target&&game.target.id!==game.targetId&&game.hits>0){game.hits=0;game.targetId=null;}
  if(game.build)updateBuild();
  if(game.autoId&&(game.moving||game.build||!game.target||game.target.id!==game.autoId))game.autoId=null;
  if((game.useHeld||game.autoId)&&!game.build)useAction();
  if(game.target&&!game.build){ring.visible=true;ring.position.set(game.target.x,groundAt(game.target.x,game.target.z)+0.06,game.target.z);ring.scale.setScalar(game.target.r+0.45);ring.material.opacity=game.autoId?0.85:0.5;}else ring.visible=false;
  if(game.swingT>0){
    game.swingT=Math.max(0,game.swingT-dt); const k=1-game.swingT/0.42;
    parts.armR.rotation.x=k<0.4?lerp(0,-2.5,k/0.4):lerp(-2.5,0.35,Math.min(1,(k-0.4)/0.35));
    parts.elbowR.rotation.x=-0.35; parts.torso.rotation.y=k<0.4?-0.25*k/0.4:lerp(-0.25,0.2,(k-0.4)/0.6);
  }
  // fires: flicker and lights on the nearest three
  const fl=fires().map(f=>({f,d:Math.hypot(f.x-player.x,f.z-player.z)})).sort((a,b)=>a.d-b.d);
  fireLights.forEach((l,i)=>{const e=fl[i];if(e&&!e.f.camp){l.position.set(e.f.x,e.f.y+1.6,e.f.z);l.intensity=(1.1+Math.sin(now*0.02+i)*0.15)*(0.45+0.8*night);}else l.intensity=0;});
  fireLight.intensity=(1.1+Math.sin(now*0.02)*0.15)*(0.45+0.8*night);
  piecesGroup.traverse(o=>{if(o.userData.flame){const s=1+Math.sin(now*0.017+o.position.x)*0.09;o.scale.set(s,s*1.12,s);}});
  // autosave
  game.saveT+=dt; if(game.dirty&&game.saveT>2||game.saveT>10){save();game.saveT=0;game.dirty=false;}
  // toast
  if(game.toastT>0){game.toastT-=dt;if(game.toastT<=0)$('toast').classList.remove('show');}
  // HUD
  game.uiT-=dt; if(game.uiT<=0){game.uiT=0.2;updateHud();}
  return {dl,night};
}
function collapse(){
  game.dead=true;
  for(const k of['wood','stone','berries'])game.inv[k]=Math.floor(game.inv[k]/2);
  toast('You collapsed. Half of what you carried is lost.');
  setTimeout(()=>{player.x=0;player.z=6;Object.assign(game.needs,{health:60,hunger:60,warmth:70});game.dead=false;game.dirty=true;},1600);

// stats from level and gear
function recalc(){
  const keepFrac=P.hp/P.maxHp;
  let dmg=14*(1+0.09*(P.level-1)), hp=220*(1+0.12*(P.level-1)), armor=0;
  for(const s of SLOTS){const it=P.equip[s];if(!it)continue;dmg+=it.dmg||0;hp+=it.hp||0;armor+=it.armor||0;}
  P.dmg=dmg;P.maxHp=Math.round(hp);P.armor=armor;P.hp=Math.min(P.maxHp,Math.max(1,P.maxHp*keepFrac));
  const h=P.equip.head, c=P.equip.chest;
  state.gear.helmet=!!h&&/helm|visor/i.test(h.name); state.gear.goggles=!!h&&!state.gear.helmet;
  state.gear.armor=!!c&&/vest|plate|cuirass/i.test(c.name); state.gear.cape=!!c&&c.r>=3; state.gear.pack=true;
  state.weapon='crossbow'; applyGear();
}
const xpNeed=l=>Math.round(120*Math.pow(l,1.45));
function gainXp(n){
  P.xp+=n; num(player.x,groundAt(player.x,player.z)+2.4,player.z,'+'+n+' XP','xp');
  while(P.xp>=xpNeed(P.level)){P.xp-=xpNeed(P.level);P.level++;recalc();P.hp=P.maxHp;P.energy=P.maxEnergy;toast('Level '+P.level+'!');}
}
function rollItem(lvl,minR,slot){
  let r=Math.random(); r=r<0.6?0:r<0.88?1:r<0.98?2:3; r=Math.max(r,minR||0);
  slot=slot||SLOTS[Math.floor(Math.random()*4)];
  const bases=BASES[slot], name=bases[Math.min(bases.length-1,Math.floor(Math.random()*2)+Math.max(0,r-1))];
  const ip=Math.round(90+lvl*12+r*32+Math.random()*16);
  const it={id:Math.random().toString(36).slice(2,9),slot,name,r,ip};
  if(slot==='weapon')it.dmg=Math.round(ip*0.09);
  else{const heavy=/plate|helm|greaves|boiler/i.test(name);it.hp=Math.round(ip*(slot==='chest'?0.62:0.36));it.armor=Math.round(ip*(heavy?0.14:0.06));}
  return it;
}
const itemStats=it=>it.slot==='weapon'?'+'+it.dmg+' damage':'+'+it.hp+' health · +'+it.armor+' armor';

function damageEnemy(e,amt,crit){
  if(e.state==='dead')return;
  amt=amt/nightMult(e.x,e.z)*(inLantern(e.x,e.z)?1.2:1); amt=Math.round(amt*(crit?1.6:1)); e.hp-=amt;
  num(e.x,groundAt(e.x,e.z)+e.mesh.userData.chest*1.4,e.z,amt+(crit?'!':''),crit?'crit':'dmg');
  if(e.state==='idle'||e.state==='return')e.state='chase';
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  e.state='dead'; e.deadT=0; if(e.bar){e.bar.remove();e.bar=null;}
  gainXp(Math.round(e.D.xp*(1+0.3*(e.lvl-1))));
  const sh=e.D.elite?20:1+Math.floor(Math.random()*3)+(e.lvl>2?1:0); P.shards+=sh; num(e.x,groundAt(e.x,e.z)+1.2,e.z,'+'+sh+' shards','shard');
  P.kills++;
  const qd=QUESTS[Q.i];
  if(Q.state==='active'&&qd){if(qd.kind==='kills')Q.progress++;if(qd.kind==='shards')Q.progress+=sh;if(qd.kind==='warden'&&e.D.elite)Q.progress++;if(Q.progress>=qd.need){Q.progress=qd.need;Q.state='ready';toast('Quest ready: return to Warden Edda');}}
  const chance=e.D.elite?1:e.type==='husk'?0.3:0.2;
  if(Math.random()<chance){const items=[rollItem(e.lvl,e.D.elite?2:0)];if(e.D.elite)items.push(rollItem(e.lvl,1));dropBag(e.x,e.z,items);}
  if(P.target===e)setTimeout(()=>{if(P.target===e)setTarget(nearestEnemy(14));},450);
  dirtyHero=true;
}
function dropBag(x,z,items){
  const best=Math.max(...items.map(i=>i.r)), g=new THREE.Group();
  const sack=new THREE.Mesh(new THREE.IcosahedronGeometry(0.32,0),eMat(0x7a5634));sack.scale.set(1,0.8,1);sack.position.y=0.25;g.add(sack);
  const tie=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.2,5),eMat(0x5a3d24));tie.position.y=0.55;g.add(tie);
  const ringM=new THREE.Mesh(new THREE.RingGeometry(0.5,0.62,24).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:RARITY[best].c,transparent:true,opacity:0.8,depthWrite:false}));ringM.position.y=0.05;g.add(ringM);
  if(best>=2){const beam=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.3,6,8,1,true),new THREE.MeshBasicMaterial({color:RARITY[best].c,transparent:true,opacity:0.28,depthWrite:false}));beam.position.y=3;g.add(beam);}
  g.position.set(x,groundAt(x,z),z); scene.add(g);
  bags.push({x,z,items,mesh:g,t:0,best});
}
function lootBag(b){
  let n=0; for(const it of b.items){if(P.bag.length>=24){toast('Bag full');break;}P.bag.push(it);n++;toast(RARITY[it.r].n+' '+it.name);}
  b.items.splice(0,n); if(!b.items.length){scene.remove(b.mesh);bags.splice(bags.indexOf(b),1);}
  dirtyHero=true; renderBag();
}

// targeting
function nearestEnemy(r){let best=null,bd=r;for(const e of enemies){if(e.state==='dead')continue;const d=Math.hypot(e.x-player.x,e.z-player.z);if(d<bd){bd=d;best=e;}}return best;}
function setTarget(e,engage){P.target=e;P.engaged=!!(e&&engage);}
function cycleTarget(){
  const list=enemies.filter(e=>e.state!=='dead'&&Math.hypot(e.x-player.x,e.z-player.z)<28).sort((a,b)=>Math.hypot(a.x-player.x,a.z-player.z)-Math.hypot(b.x-player.x,b.z-player.z));
  if(!list.length){setTarget(null);toast('No enemies nearby');return;}
  const i=list.indexOf(P.target); setTarget(list[(i+1)%list.length],false);
}
function attackPressed(){
  if(!P.target||P.target.state==='dead'){const e=nearestEnemy(26);if(!e){toast('No enemies nearby');return;}setTarget(e,true);}
  else P.engaged=true;
}
function autoMove(mag){
  if(mag>0.05||!P.engaged||!P.target||P.dead||game.build||P.ctrl==='action')return null;
  const t=P.target, d=Math.hypot(t.x-player.x,t.z-player.z);
  if(d<=AA_RANGE*0.92)return null;
  const s=Math.sin(cam.yaw), c=Math.cos(cam.yaw); return {x:(t.x-player.x)/d,z:(t.z-player.z)/d};
}
function onTap(x,y){
  let best=null,bd=70;
  for(const e of enemies){if(e.state==='dead')continue;const s=toScreen(e.x,groundAt(e.x,e.z)+e.mesh.userData.chest*e.mesh.scale.y,e.z);if(!s)continue;const d=Math.hypot(s.x-x,s.y-y);if(d<bd){bd=d;best=e;}}
  if(best){setTarget(best,true);return true;}
  for(const b of bags){const s=toScreen(b.x,groundAt(b.x,b.z)+0.4,b.z);if(s&&Math.hypot(s.x-x,s.y-y)<55){if(Math.hypot(b.x-player.x,b.z-player.z)<3)lootBag(b);else toast('Walk closer to loot');return true;}}
  const s=toScreen(QG.x,groundAt(QG.x,QG.z)+1.2,QG.z);if(s&&Math.hypot(s.x-x,s.y-y)<55){if(Math.hypot(QG.x-player.x,QG.z-player.z)<4)openDialog();else toast('Walk closer to talk');return true;}
  return false;
}

// skills
// skill aiming: Classic uses skillshots (drag on touch, mouse cursor on PC); Action aims at the crosshair
const AIM={shot:{type:'line',range:18},shock:{type:'area',range:14,r:3.6},dash:{type:'line',range:6.7},patch:{type:'self'},turret:{type:'area',range:6,r:0.8}};
function quickAim(id){
  const A=AIM[id]; let t=P.target&&P.target.state!=='dead'?P.target:nearestEnemy(A.range+4);
  if(t&&id!=='dash'){const d=Math.hypot(t.x-player.x,t.z-player.z)||1;return {dx:(t.x-player.x)/d,dz:(t.z-player.z)/d,dist:Math.min(d,A.range||0),t};}
  return {dx:Math.sin(player.face),dz:Math.cos(player.face),dist:id==='turret'?1.6:Math.min(8,A.range||0)};
}
function cursorAim(id){
  const a=aimPoint(), dx=a.x-player.x, dz=a.z-player.z, d=Math.hypot(dx,dz);
  if(d<0.3)return quickAim(id);
  return {dx:dx/d,dz:dz/d,dist:Math.min(d,AIM[id].range||0),t:a.e||null};
}
function cast(id,aim){
  if(P.dead||game.build)return;
  const S=SKILLS[id];
  if(P.cds[id]>0)return;
  if(P.energy<S.cost){toast('Not enough energy');return;}
  if(!aim)aim=(P.ctrl==='action'||!coarse)?cursorAim(id):quickAim(id);
  if(id==='dash'&&P.ctrl==='action'){const kx=(keys.has('d')?1:0)-(keys.has('a')?1:0),ky=(keys.has('s')?1:0)-(keys.has('w')?1:0);if(kx||ky){const fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw),rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw);let dx=fx*(-ky)+rx*kx,dz=fz*(-ky)+rz*kx;const m=Math.hypot(dx,dz);aim={dx:dx/m,dz:dz/m,dist:6.7};}}
  P.energy-=S.cost; P.cds[id]=S.cd;
  const A=AIM[id];
  if(id!=='patch')player.face=Math.atan2(aim.dx,aim.dz);
  if(id==='shot'){
    if(P.ctrl==='action'){fireStraight(P.dmg*3.2,true);return;}
    const m=muzzle(), mesh=new THREE.Mesh(boltGeo,bigBoltMat); mesh.scale.set(3,3,1.6); mesh.position.set(m.x,m.y,m.z);
    mesh.lookAt(m.x+aim.dx,m.y,m.z+aim.dz); scene.add(mesh);
    projectiles.push({kind:'straight',mesh,dir:{x:aim.dx,y:0,z:aim.dz},dmg:P.dmg*3.2,speed:38,left:A.range,flat:true}); P.recoil=0.15;
  }else if(id==='shock'){lob(player.x+aim.dx*aim.dist,player.z+aim.dz*aim.dist);}
  else if(id==='dash'){P.dash={dx:aim.dx,dz:aim.dz,t:0.24};puff(player.x,player.z,0xd8dde6);}
  else if(id==='patch'){P.hot=4;P.hotRate=P.maxHp*0.36/4;num(player.x,groundAt(player.x,player.z)+2.2,player.z,'Patch kit','heal');}
  else if(id==='turret'){deployTurret(player.x+aim.dx*Math.max(1.2,aim.dist),player.z+aim.dz*Math.max(1.2,aim.dist));}
}

const indMat=new THREE.MeshBasicMaterial({color:0x8fd8ff,transparent:true,opacity:0.42,depthWrite:false,depthTest:false,side:THREE.DoubleSide});
const indEdge=new THREE.MeshBasicMaterial({color:0xe8fbff,transparent:true,opacity:0.95,depthWrite:false,depthTest:false,side:THREE.DoubleSide});

const indCircle=new THREE.Mesh(new THREE.CircleGeometry(1,40).rotateX(-Math.PI/2),indMat);

let skAim=null;
function dragToAim(id,dx,dy){
  const A=AIM[id], len=Math.hypot(dx,dy), fx=-Math.sin(cam.yaw), fz=-Math.cos(cam.yaw), rx=Math.cos(cam.yaw), rz=-Math.sin(cam.yaw);
  if(len<1)return quickAim(id);

  return {dx:wx,dz:wz,dist:A.type==='area'?Math.min(1,len/90)*A.range:A.range};
}
function showIndicator(id,aim,cancel){

  if(A.type==='area'){indCircle.scale.setScalar(A.r);indCircle.position.set(aim.dx*aim.dist,0.02,aim.dz*aim.dist);}
}
function startSkillAim(btn,e){
  const id=btn.dataset.sk; if(AIM[id].type==='self'||P.ctrl==='action'||!coarse){cast(id);return;}
  if(P.cds[id]>0||P.dead)return;
  const r=btn.getBoundingClientRect(); skAim={id,pid:e.pointerId,cx:r.left+r.width/2,cy:r.top+r.height/2,dx:0,dy:0,moved:false,cancel:false};
  try{btn.setPointerCapture(e.pointerId);}catch(_){}
  $('skCancel').hidden=false;
}
function moveSkillAim(e){
  if(!skAim||e.pointerId!==skAim.pid)return;
  skAim.dx=e.clientX-skAim.cx; skAim.dy=e.clientY-skAim.cy; if(Math.hypot(skAim.dx,skAim.dy)>14)skAim.moved=true;
  const c=$('skCancel').getBoundingClientRect(); skAim.cancel=e.clientX>c.left&&e.clientX<c.right&&e.clientY>c.top&&e.clientY<c.bottom;
  $('skCancel').classList.toggle('hot',skAim.cancel);
}
function endSkillAim(e,cancelled){
  if(!skAim||e.pointerId!==skAim.pid)return;
  const a=skAim; skAim=null; indicator.visible=false; $('skCancel').hidden=true; $('skCancel').classList.remove('hot');
  if(cancelled||a.cancel)return;
  cast(a.id,a.moved?dragToAim(a.id,a.dx,a.dy):quickAim(a.id));
}
function updateSkillAim(){if(skAim){const aim=skAim.moved?dragToAim(skAim.id,skAim.dx,skAim.dy):quickAim(skAim.id);showIndicator(skAim.id,aim,skAim.cancel);}}

// spawning
let spawnT=0;
function spawner(dt){
  spawnT-=dt; if(spawnT>0)return; spawnT=1.4;
  for(const e of enemies.slice())if(!e.D.elite&&Math.hypot(e.x-player.x,e.z-player.z)>85&&e!==P.target)removeEnemy(e);
  if(Q.state==='active'&&QUESTS[Q.i]&&QUESTS[Q.i].id==='tower')ensureWarden();
  const t=warpDist(player.x,player.z), b=biomeIndex(t), night=1-daylight();
  const want=[4,6,7,8][b]+(night>0.5?3:0);
  const alive=enemies.filter(e=>e.state!=='dead'&&!e.D.elite).length; if(alive>=want)return;
  for(let k=0;k<6;k++){
    const a=Math.random()*Math.PI*2, r=26+Math.random()*16, x=player.x+Math.sin(a)*r, z=player.z+Math.cos(a)*r;
    if(warpDist(x,z)<150||Math.hypot(x-CITY.x,z-CITY.z)<PEACE_R||islandE(x,z)>0.95||heightAt(x,z)<0.2||Math.hypot(x-TOWER.x,z-TOWER.z)<18)continue;
    const lvl=1+Math.floor(warpDist(x,z)/120);
    spawnEnemy(Math.random()<(b===0?0.65:0.45)?'wolf':'husk',x,z,lvl); break;
  }
}

function combatUpdate(dt,now){
  const camp=warpDist(player.x,player.z)<70;
  spawner(dt);
  // player resources and cooldowns
  for(const k in P.cds)P.cds[k]=Math.max(0,P.cds[k]-dt);
  P.energy=Math.min(P.maxEnergy,P.energy+dt*7);
  P.lastHit+=dt;
  if(!P.dead){
    if(P.hot>0){const h=Math.min(P.hot,dt);P.hot-=h;P.hp=Math.min(P.maxHp,P.hp+P.hotRate*h);}
    if(P.lastHit>5)P.hp=Math.min(P.maxHp,P.hp+P.maxHp*(camp?0.08:0.025)*dt);
  }
  if(P.dash&&P.dash.t>0){const s=Math.min(dt,P.dash.t);P.dash.t-=s;player.x+=P.dash.dx*28*s;player.z+=P.dash.dz*28*s;collide();player.face=Math.atan2(P.dash.dx,P.dash.dz);}
  // auto-attack
  const t=P.target;
  if(t&&t.state==='dead'&&P.target===t&&t.deadT>0.5)setTarget(null);
  if(t&&t.state!=='dead'&&!P.dead&&!game.build){
    const d=Math.hypot(t.x-player.x,t.z-player.z);
    if(d>40)setTarget(null);
    else if(P.engaged&&!game.moving&&P.ctrl!=='action'){faceTo(t);P.aaT-=dt;if(d<=AA_RANGE&&P.aaT<=0){P.aaT=1.05;fire(t,P.dmg*(0.9+Math.random()*0.2),false);}}
  }
  if(P.recoil>0){P.recoil=Math.max(0,P.recoil-dt);parts.armR.rotation.x=-0.85-P.recoil*2;}
  // projectiles
  for(const pr of projectiles.slice()){
    if(pr.kind==='bolt'){
      const e=pr.t; const tx=e.x, ty=groundAt(e.x,e.z)+e.mesh.userData.chest*e.mesh.scale.y*0.8, tz=e.z;
      const p=pr.mesh.position, dx=tx-p.x, dy=ty-p.y, dz=tz-p.z, d=Math.hypot(dx,dy,dz), step=pr.speed*dt;
      pr.mesh.lookAt(tx,ty,tz);
      if(d<=step||e.state==='dead'){if(e.state!=='dead')damageEnemy(e,pr.dmg,Math.random()<0.12);scene.remove(pr.mesh);projectiles.splice(projectiles.indexOf(pr),1);}
      else p.set(p.x+dx/d*step,p.y+dy/d*step,p.z+dz/d*step);
    }else if(pr.kind==='straight'){
      const step=pr.speed*dt, p=pr.mesh.position; p.set(p.x+pr.dir.x*step,p.y+pr.dir.y*step,p.z+pr.dir.z*step); pr.left-=step;
      let hit=null;for(const e of enemies){if(e.state==='dead')continue;const cy=groundAt(e.x,e.z)+e.mesh.userData.chest*e.mesh.scale.y,r=(e.D.elite?1.5:0.85)*e.mesh.scale.y;if(Math.hypot(p.x-e.x,p.y-cy,p.z-e.z)<r){hit=e;break;}}
      if(hit)damageEnemy(hit,pr.dmg,Math.random()<0.15);
      if(pr.flat)p.y=groundAt(p.x,p.z)+1.35;
      if(hit||pr.left<=0||p.y<groundAt(p.x,p.z)-0.6){scene.remove(pr.mesh);projectiles.splice(projectiles.indexOf(pr),1);}
    }else{
      pr.t+=dt; const k=Math.min(1,pr.t/pr.dur);
      pr.mesh.position.set(lerp(pr.sx,pr.tx,k),lerp(pr.sy,pr.ty,k)+Math.sin(k*Math.PI)*3,lerp(pr.sz,pr.tz,k));
      if(k>=1){scene.remove(pr.mesh);projectiles.splice(projectiles.indexOf(pr),1);burst(pr.tx,pr.tz,3.6,0x8fd8ff);
        for(const e of enemies)if(e.state!=='dead'&&Math.hypot(e.x-pr.tx,e.z-pr.tz)<3.6){damageEnemy(e,P.dmg*1.9,false);e.slow=3;}}
    }
  }
  // enemies
  for(const e of enemies.slice()){
    const D=e.D, m=e.mesh, ud=m.userData;
    if(e.state==='dead'){e.deadT+=dt;m.position.y-=dt*0.6;ud.body.rotation.z=Math.min(1.4,e.deadT*3);if(e.deadT>2.2)removeEnemy(e);continue;}
    const dx=player.x-e.x, dz=player.z-e.z, d=Math.hypot(dx,dz), leash=e.leash||34;
    if(e.slow>0)e.slow-=dt; const sp=D.speed*(e.slow>0?0.55:1);
    let mv=0;
    if(e.state==='idle'){
      e.wander-=dt; if(e.wander<=0){e.wander=3+Math.random()*4;const a=Math.random()*6.28;e.wx=e.sx+Math.sin(a)*6;e.wz=e.sz+Math.cos(a)*6;}
      const wx=e.wx-e.x,wz=e.wz-e.z,wd=Math.hypot(wx,wz); if(wd>0.5){e.x+=wx/wd*sp*0.35*dt;e.z+=wz/wd*sp*0.35*dt;e.face=Math.atan2(wx,wz);mv=0.35;}
      if(!P.dead&&d<D.aggro&&!camp)e.state='chase';
    }else if(e.state==='chase'){
      if(P.dead||Math.hypot(e.x-e.sx,e.z-e.sz)>leash||warpDist(player.x,player.z)<60)e.state='return';
      else if(d>D.range*0.9){e.x+=dx/d*sp*dt;e.z+=dz/d*sp*dt;mv=1;e.face=Math.atan2(dx,dz);}
      else{e.face=Math.atan2(dx,dz);e.cd-=dt;if(e.cd<=0&&e.wind<=0){e.wind=0.38;}
        if(e.wind>0){e.wind-=dt;if(e.wind<=0){e.cd=D.cd;if(d<D.range+0.8)hurtPlayer(e.dmg*(0.9+Math.random()*0.2),e);}}}
      if(D.elite&&e.state==='chase'){e.slamT-=dt;if(e.slamT<=0&&!e.slam&&d<9){e.slam={t:1.3,x:e.x,z:e.z};const tg=new THREE.Mesh(new THREE.CircleGeometry(4.5,40).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xff4a3a,transparent:true,opacity:0.3,depthWrite:false}));tg.position.set(e.x,groundAt(e.x,e.z)+0.08,e.z);scene.add(tg);e.slam.mesh=tg;}
        if(e.slam){e.slam.t-=dt;e.slam.mesh.material.opacity=0.25+0.25*(1-e.slam.t/1.3);if(e.slam.t<=0){scene.remove(e.slam.mesh);burst(e.slam.x,e.slam.z,4.5,0xff6a4a);if(Math.hypot(player.x-e.slam.x,player.z-e.slam.z)<4.5)hurtPlayer(e.dmg*2.4,e);e.slam=null;e.slamT=8;}}}
    }else if(e.state==='return'){
      const rx=e.sx-e.x, rz=e.sz-e.z, rd=Math.hypot(rx,rz); e.hp=Math.min(e.maxHp,e.hp+e.maxHp*0.5*dt);
      if(rd<1){e.state='idle';}else{e.x+=rx/rd*sp*1.2*dt;e.z+=rz/rd*sp*1.2*dt;e.face=Math.atan2(rx,rz);mv=1;}
    }
    // separate from other enemies
    for(const o of enemies){if(o===e||o.state==='dead')continue;const ox=e.x-o.x,oz=e.z-o.z,od=Math.hypot(ox,oz),R=D.elite||o.D.elite?2.2:1.1;if(od<R&&od>1e-3){e.x+=ox/od*(R-od)*0.5;e.z+=oz/od*(R-od)*0.5;}}
    e.phase+=dt*mv*sp*1.6;
    m.position.set(e.x,groundAt(e.x,e.z),e.z); m.rotation.y=e.face;
    const sw=Math.sin(e.phase)*0.6*Math.min(1,mv*1.5);
    ud.legs.forEach((l,i)=>{l.rotation.x=(i%2?sw:-sw)*(e.type==='wolf'&&i>1?-1:1)+(e.type!=='wolf'&&i<2?-0.2-(e.wind>0?1.4*(1-e.wind/0.38):0):0);});
    // health bar
    const show=e.hp<e.maxHp||P.target===e||D.elite;
    if(show&&d<34){
      if(!e.bar){e.bar=document.createElement('div');e.bar.className='ebar'+(D.elite?' elite':'');e.bar.innerHTML='<i></i>';$('ebars').appendChild(e.bar);}
      const s=toScreen(e.x,groundAt(e.x,e.z)+ud.chest*m.scale.y*1.55,e.z);
      if(s){e.bar.style.transform='translate('+(s.x-30)+'px,'+s.y+'px)';e.bar.firstChild.style.width=Math.max(0,e.hp/e.maxHp*100)+'%';e.bar.classList.toggle('tgt',P.target===e);e.bar.hidden=false;}else e.bar.hidden=true;
    }else if(e.bar){e.bar.hidden=true;}
  }
  // loot bags: bob, expire, nearby prompt
  for(const b of bags.slice()){b.t+=dt;b.mesh.children[0].position.y=0.25+Math.sin(now*0.004+b.x)*0.04;if(b.t>180){scene.remove(b.mesh);bags.splice(bags.indexOf(b),1);}}
  // effects
  for(const f of effects.slice()){

    if(f.kind==='num'){const s=toScreen(f.x,f.y+k*1.2,f.z);if(s){f.el.style.transform='translate('+(s.x+f.dx*k)+'px,'+s.y+'px)';f.el.style.opacity=String(1-Math.max(0,k-0.6)/0.4);}if(k>=1){f.el.remove();effects.splice(effects.indexOf(f),1);}}
    else{f.mesh.scale.setScalar(0.4+k*f.r*1.6);f.mesh.material.opacity=0.8*(1-k);if(k>=1){scene.remove(f.mesh);f.mesh.geometry.dispose();effects.splice(effects.indexOf(f),1);}}
  }

  heroSaveT+=dt; if(dirtyHero&&heroSaveT>2||heroSaveT>15){saveHero();heroSaveT=0;dirtyHero=false;}
}

    const b=BIOMES[biomeIndex(t)];
    $('biomeName').textContent=placeName(player.x,player.z); $('biomeSwatch').style.background=b.swatch;
    $('metaLine').textContent=Math.round(Math.hypot(player.x,player.z))+' m from camp · seed '+state.seed;
    $('fogFill').style.width=Math.round(f*100)+'%';
  }

  requestAnimationFrame(frame);
}

/* ---------- Boot (keeps your place if the page is updated while open) ---------- */
function start(data){
  if(!KIT.done){KIT.waiters.push(()=>start(data));return;}
  data=data||{};
  let seed=data.seed;
  if(seed==null){const m=/^#s(\d+)$/.exec(location.hash||'');seed=m?Number(m[1]):((Math.random()*1e6)|0);}
  if(data.gear){state.gear=data.gear;state.weapon=data.weapon||'none';}
  if(data.cam)Object.assign(cam,data.cam); else cam.yaw=0.25;
  applyGear();
  loadHero(); loadPeople(); buildAdmin();
  if(!coarse){$('ctrlBtn').hidden=false;$('ctrlBtn').addEventListener('click',()=>setCtrl(P.ctrl==='action'?'classic':'action'));}
  setCtrl(P.ctrl);
  newWorld(seed,data.player,data.core);
  document.getElementById('loading').remove(); restStick();
  requestAnimationFrame(t=>{last=t;frame(t);});
}
try{window.claude?.hot?.snapshot?.(()=>({seed:state.seed,gear:state.gear,weapon:state.weapon,cam:{...cam},player:{x:player.x,z:player.z,face:player.face},core:serialize()}));}catch(_){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
